                          <td className="py-3 px-4 text-center">
                            {canGrantSubDeptExam(role) && <button onClick={() => onUpdateUserField(u.id, { canTakeSubdeptExam: !u.canTakeSubdeptExam })} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${u.canTakeSubdeptExam ? "bg-indigo-600 text-white" : "bg-slate-200 text-slate-700"}`}>{u.canTakeSubdeptExam ? "✓ Engedélyezve" : "Tiltva"}</button>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {subTab === "editor" && (
            <div className="card p-6 space-y-5">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4">
                <div className="flex flex-wrap gap-2">
                  {[
                    { id: "altalanos_ooc", l: `Általános OOC (${(questionsByCat.altalanos_ooc || []).length})` },
                    { id: "altalanos_ic", l: `Általános IC (${(questionsByCat.altalanos_ic || []).length})` },
                    { id: "motoros", l: `Mentőmotoros (${(questionsByCat.motoros || []).length})` },
                    { id: "helikopteres", l: `Mentőhelikopteres (${(questionsByCat.helikopteres || []).length})` }
                  ].map((c) => {
                    const ok = canEditExamCat(role, c.id);
                    return <button key={c.id} disabled={!ok} onClick={() => { setEdCat(c.id); setShowQForm(false); }} className={`px-3.5 py-2 rounded-lg text-xs font-bold inline-flex items-center gap-1.5 ${edCat === c.id ? "bg-slate-900 text-white" : ok ? "bg-slate-100 text-slate-700" : "bg-slate-50 text-slate-400 border"}`}>{!ok && <Icons.Lock c="w-3.5 h-3.5" />}{c.l}</button>;
                  })}
                </div>
                {canEditExamCat(role, edCat) && <button onClick={() => { setQForm({ id: null, question: "", options: ["", "", "", ""], correctIndex: 0, explanation: "" }); setShowQForm(true); }} className="inline-flex items-center gap-1.5 px-4 py-2 bg-red-600 text-white text-sm font-semibold rounded-lg"><Icons.Plus c="w-4 h-4" />Új kérdés</button>}
              </div>
              {showQForm && (
                <form onSubmit={(e) => { e.preventDefault(); if (!qForm.question.trim() || qForm.options.some((o) => !o.trim())) { alert("Töltsd ki minden mezőt!"); return; } const isEd = Boolean(qForm.id); onSaveQuestion(edCat, { ...qForm, id: qForm.id || "q-" + Date.now(), sortOrder: isEd ? qForm.sortOrder : (questionsByCat[edCat] || []).length }, isEd); setShowQForm(false); }} className="p-5 bg-slate-50 border rounded-xl space-y-4">
                  <input type="text" value={qForm.question} onChange={(e) => setQForm({ ...qForm, question: e.target.value })} placeholder="Kérdés szövege..." className="inp" required />
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {qForm.options.map((opt, idx) => (
                      <div key={idx} className="bg-white p-3 rounded-lg border space-y-1.5">
                        <div className="flex justify-between text-xs font-bold"><span>{String.fromCharCode(65 + idx)}. opció</span><label className="text-emerald-700 cursor-pointer flex items-center gap-1"><input type="radio" checked={qForm.correctIndex === idx} onChange={() => setQForm({ ...qForm, correctIndex: idx })} />Helyes</label></div>
                        <input type="text" value={opt} onChange={(e) => { const n = [...qForm.options]; n[idx] = e.target.value; setQForm({ ...qForm, options: n }); }} className="inp text-sm py-1.5" required />
                      </div>
                    ))}
                  </div>
                  <textarea rows="2" value={qForm.explanation} onChange={(e) => setQForm({ ...qForm, explanation: e.target.value })} placeholder="Magyarázat..." className="inp" />
                  <div className="flex justify-end gap-2"><button type="button" onClick={() => setShowQForm(false)} className="px-4 py-2 bg-slate-200 text-sm font-semibold rounded-lg">Mégse</button><button type="submit" className="px-5 py-2 bg-emerald-600 text-white text-sm font-bold rounded-lg">Mentés Supabase-be</button></div>
                </form>
              )}
              <div className="space-y-3">
                {(questionsByCat[edCat] || []).map((q, idx) => (
                  <div key={q.id} className="p-4 rounded-xl border bg-slate-50/60 space-y-2">
                    <div className="flex justify-between gap-3"><h5 className="font-bold text-sm">{idx + 1}. {q.question}</h5>{canEditExamCat(role, edCat) && <div className="flex gap-1"><button onClick={() => { setQForm({ ...q, options: [...q.options] }); setShowQForm(true); }} className="p-1 text-slate-500 hover:text-indigo-600"><Icons.Edit c="w-4 h-4" /></button><button onClick={() => { if (window.confirm("Törlöd?")) onDeleteQuestion(edCat, q.id); }} className="p-1 text-slate-500 hover:text-red-600"><Icons.Trash c="w-4 h-4" /></button></div>}</div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs">{q.options.map((o, oi) => <div key={oi} className={`px-2.5 py-1.5 rounded border ${oi === q.correctIndex ? "bg-emerald-50 border-emerald-300 font-bold" : "bg-white"}`}>{String.fromCharCode(65 + oi)}. {o}</div>)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === "results" && canViewResults(role) && (
            <div className="card p-6 space-y-4">
              <div className="flex items-center justify-between"><div><h3 className="text-lg font-bold">Hivatalos Vizsgaeredmények Naplója</h3><p className="text-xs text-slate-500">Részletes visszanézéssel és törléssel a Vezetőségnek.</p></div><span className="px-3 py-1 rounded-full bg-slate-100 text-xs font-bold">Összesen: {examResults.length}</span></div>
              <div className="overflow-x-auto rounded-xl border border-slate-200">
                <table className="w-full text-left border-collapse">
                  <thead><tr className="bg-slate-900 text-white text-xs uppercase"><th className="py-3 px-4">Dátum</th><th className="py-3 px-4">Vizsgázó</th><th className="py-3 px-4">Rang</th><th className="py-3 px-4">Típus</th><th className="py-3 px-4">Pont</th><th className="py-3 px-4">%</th><th className="py-3 px-4">Státusz</th><th className="py-3 px-4 text-right">Műveletek</th></tr></thead>
                  <tbody className="divide-y divide-slate-200 text-sm">
                    {examResults.map((res) => (
                      <tr key={res.id} className="hover:bg-slate-50">
                        <td className="py-3 px-4 text-xs font-mono text-slate-500">{res.date}</td>
                        <td className="py-3 px-4 font-bold">{res.userName}</td>
                        <td className="py-3 px-4 text-xs font-semibold">{res.roleLabel}</td>
                        <td className="py-3 px-4">{res.categoryLabel}</td>
                        <td className="py-3 px-4 font-semibold">{res.score}/{res.total}</td>
                        <td className="py-3 px-4 font-bold">{res.percentage}%</td>
                        <td className="py-3 px-4"><span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${res.passed ? "bg-emerald-100 text-emerald-800" : "bg-red-100 text-red-800"}`}>{res.passed ? "SIKERES" : "SIKERTELEN"}</span></td>
                        <td className="py-3 px-4 text-right">
                          <div className="inline-flex gap-2">
                            <button onClick={() => setViewingResult(res)} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-900 hover:bg-indigo-600 text-white text-xs font-bold rounded-lg"><Icons.Eye c="w-3.5 h-3.5" />Vizsga megtekintése</button>
                            <button onClick={() => { if (window.confirm(`Biztosan törlöd ${res.userName} vizsgáját?`)) { onDeleteResult(res.id); if (viewingResult?.id === res.id) setViewingResult(null); } }} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-red-100 hover:bg-red-600 text-red-700 hover:text-white text-xs font-bold rounded-lg"><Icons.Trash c="w-3.5 h-3.5" />Törlés</button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {viewingResult && (
                <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl max-w-4xl w-full max-h-[88vh] flex flex-col shadow-2xl overflow-hidden">
                    <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                      <div><div className="text-xs font-bold uppercase text-amber-400">{viewingResult.date}</div><h4 className="text-lg font-extrabold">{viewingResult.userName} – {viewingResult.categoryLabel} ({viewingResult.percentage}%)</h4></div>
                      <button onClick={() => setViewingResult(null)} className="p-2 rounded-lg bg-slate-800 hover:bg-red-600"><Icons.X c="w-5 h-5" /></button>
                    </div>
                    <div className="p-6 overflow-y-auto space-y-3">
                      {(!viewingResult.details || !viewingResult.details.length) ? <div className="p-6 text-center bg-slate-50 rounded-xl text-sm text-slate-500">Ehhez a rekordhoz nem tartozik mentett részletes kérdésnapló.</div>
                        : viewingResult.details.map((d, i) => (
                          <div key={i} className={`p-4 rounded-xl border text-sm space-y-2 ${d.isCorrect ? "border-emerald-200 bg-emerald-50/40" : "border-red-200 bg-red-50/40"}`}>
                            <div className="flex justify-between gap-2 font-bold"><span>{i + 1}. {d.question}</span><span className={`px-2 py-0.5 rounded text-[11px] text-white shrink-0 ${d.isCorrect ? "bg-emerald-600" : "bg-red-600"}`}>{d.isCorrect ? "Helyes" : "Hibás"}</span></div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs">
                              {(d.options || []).map((opt, oi) => <div key={oi} className={`px-2.5 py-1.5 rounded border flex justify-between ${d.correctIndex === oi ? "bg-emerald-100 border-emerald-400 font-bold" : d.selectedIndex === oi ? "bg-red-100 border-red-400 font-bold" : "bg-white"}`}><span>{String.fromCharCode(65 + oi)}. {opt}</span>{d.selectedIndex === oi && <span className="px-1.5 bg-slate-900 text-white text-[10px] rounded">Jelölés</span>}</div>)}
                            </div>
                          </div>
                        ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const DutyStatistics = ({ users, currentUser, onResetSingleTotalDuty, onResetAllTotalDuty }) => {
      const [search, setSearch] = useState("");
      const [sortBy, setSortBy] = useState("weekly");
      const isLeadership = currentUser.role === "vezetoseg";
      const allSum = useMemo(() => users.reduce((s, u) => s + (Number(u.dutyMinutes) || 0), 0), [users]);
      const okCnt = users.filter((u) => (Number(u.dutyMinutes) || 0) >= WEEKLY_DUTY_MIN).length;
      const me = users.find((u) => u.id === currentUser.id) || currentUser;
      const sorted = useMemo(() => {
        const f = users.filter((u) => u.name.toLowerCase().includes(search.toLowerCase()) || u.badgeNumber.toLowerCase().includes(search.toLowerCase()) || (ROLES[u.role]?.label || "").toLowerCase().includes(search.toLowerCase()));
        return [...f].sort((a, b) => sortBy === "total" ? (Number(b.totalDutyMinutes) || 0) - (Number(a.totalDutyMinutes) || 0) : (Number(b.dutyMinutes) || 0) - (Number(a.dutyMinutes) || 0));
      }, [users, search, sortBy]);

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-[#0F172A] via-slate-900 to-slate-800 text-white rounded-2xl p-6 md:p-7 shadow-md border border-slate-700">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
              <div>
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-600/20 border border-red-500/40 text-amber-400 text-xs font-bold uppercase"><Icons.Chart c="w-3.5 h-3.5" />Regisztrált Állomány Összesített Dutyideje</div>
                <div className="text-3xl md:text-4xl font-extrabold mt-2">{fmtN(allSum)} perc <span className="text-xl md:text-2xl font-bold text-amber-400">({fmtHrs(allSum)})</span></div>
                <p className="text-xs text-slate-300 mt-1">Élő összesítés mind a(z) <strong>{users.length} fő</strong> regisztrált tag aktuális heti dutypercéből.</p>
              </div>
              <div className="grid grid-cols-2 gap-3 shrink-0">
                <div className="bg-white/5 border border-white/10 rounded-xl p-4 text-center"><div className="text-[11px] uppercase text-slate-400 font-bold">Heti minimum</div><div className="text-xl font-extrabold text-amber-400">{WEEKLY_DUTY_MIN} perc</div></div>
                <div className="bg-white/5 border border-white/10 rounded-xl p-4 text-center"><div className="text-[11px] uppercase text-slate-400 font-bold">Teljesítette</div><div className="text-xl font-extrabold text-emerald-400">{okCnt} / {users.length} fő</div></div>
              </div>
            </div>
          </div>

          <div className="card p-6 space-y-5">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div><h3 className="text-xl font-extrabold">Állományi Duty Ranglista</h3><p className="text-sm text-slate-500">Heti kötelező minimum: {WEEKLY_DUTY_MIN} perc • Első hónapos cél: 3.200 perc</p></div>
              <div className="flex flex-wrap items-center gap-3">
                {isLeadership && (
                  <button type="button" onClick={onResetAllTotalDuty} className="inline-flex items-center gap-1.5 px-3.5 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-extrabold rounded-lg shadow-sm">
                    <Icons.Refresh c="w-3.5 h-3.5" />Összesített duty nullázása (mind)
                  </button>
                )}
                <div className="inline-flex rounded-lg bg-slate-100 p-1">
                  <button onClick={() => setSortBy("weekly")} className={`px-3 py-1.5 rounded-md text-xs font-bold ${sortBy === "weekly" ? "bg-slate-900 text-white" : "text-slate-600"}`}>Heti duty szerint</button>
                  <button onClick={() => setSortBy("total")} className={`px-3 py-1.5 rounded-md text-xs font-bold ${sortBy === "total" ? "bg-slate-900 text-white" : "text-slate-600"}`}>Összesített szerint</button>
                </div>
                <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Keresés..." className="inp sm:w-56 py-1.5" />
              </div>
            </div>
            <div className="overflow-x-auto rounded-xl border border-slate-200">
              <table className="w-full text-left border-collapse">
                <thead><tr className="bg-slate-900 text-white text-xs uppercase"><th className="py-3 px-4">#</th><th className="py-3 px-4">Jelvény</th><th className="py-3 px-4">IC-név</th><th className="py-3 px-4">Rang</th><th className="py-3 px-4">Heti dutyperc ({WEEKLY_DUTY_MIN} p)</th><th className="py-3 px-4">Összesített duty (3.200 p cél)</th></tr></thead>
                <tbody className="divide-y divide-slate-200 text-sm">
                  {sorted.map((u, idx) => {
                    const w = Number(u.dutyMinutes) || 0, tot = Number(u.totalDutyMinutes) || 0, wOk = w >= WEEKLY_DUTY_MIN, pct = Math.min(100, Math.round((tot / 3200) * 100)), isMe = u.id === me.id, ri = ROLES[u.role] || ROLES.mentos;
                    return (
                      <tr key={u.id} className={isMe ? "bg-amber-50/70" : "hover:bg-slate-50"}>
                        <td className="py-3.5 px-4 font-extrabold text-slate-500 text-xs">#{idx + 1}</td>
                        <td className="py-3.5 px-4 font-mono text-xs font-bold">{u.badgeNumber}</td>
                        <td className="py-3.5 px-4 font-bold">{u.name} {isMe && <span className="ml-1 px-1.5 py-0.5 bg-slate-900 text-amber-400 text-[10px] rounded uppercase">Te</span>}</td>
                        <td className="py-3.5 px-4"><span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${ri.badgeClass}`}>{ri.label}</span></td>
                        <td className="py-3.5 px-4"><span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${wOk ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-900"}`}>{fmtN(w)} perc</span></td>
                        <td className="py-3.5 px-4 min-w-[240px]">
                          <div className="flex items-center justify-between gap-2 text-xs mb-1">
                            <span className="font-bold">{fmtN(tot)} perc ({fmtHrs(tot)})</span>
                            <div className="flex items-center gap-2">
                              <span className="font-bold">{pct}%</span>
                              {isLeadership && (
                                <button type="button" onClick={() => { if (window.confirm(`Biztosan 0-ra állítod ${u.name} összesített (3.200 p cél) dutyidejét?`)) onResetSingleTotalDuty(u); }} title="Összesített duty nullázása" className="px-2 py-0.5 bg-red-100 hover:bg-red-600 text-red-700 hover:text-white text-[11px] font-extrabold rounded">0-zás</button>
                              )}
                            </div>
                          </div>
                          <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${tot >= 3200 ? "bg-emerald-500" : "bg-amber-500"}`} style={{ width: `${pct}%` }} /></div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const UserManagement = ({ users, onAddUser, onUpdateUserField, onSaveWeeklyDuty, onResetSingleWeeklyDuty, onResetAllWeeklyDuty, onResetSingleTotalDuty, onResetAllTotalDuty, onDeleteUser, currentUserId, missingColsAlert }) => {
      const [search, setSearch] = useState("");
      const [nu, setNu] = useState({ name: "", username: "", password: "", badgeNumber: "", role: "mentos" });
      const [pwdId, setPwdId] = useState(null);
      const [pwdVal, setPwdVal] = useState("");
      const [wIn, setWIn] = useState({});
      const [savedId, setSavedId] = useState(null);

      const filtered = users.filter((u) => u.name.toLowerCase().includes(search.toLowerCase()) || u.username.toLowerCase().includes(search.toLowerCase()) || u.badgeNumber.toLowerCase().includes(search.toLowerCase()) || (ROLES[u.role]?.label || "").toLowerCase().includes(search.toLowerCase()));

      return (
        <div className="space-y-6">
          {missingColsAlert && (
            <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 text-xs text-amber-950 space-y-1.5">
              <div className="font-bold">Hiányzó Supabase oszlopok észlelve – futtasd ezt az SQL Editorban:</div>
              <code className="block bg-white border p-2 rounded font-mono text-[11px] select-all whitespace-pre-wrap">{`ALTER TABLE public.omsz_users ADD COLUMN IF NOT EXISTS total_duty_minutes INTEGER NOT NULL DEFAULT 0;\nALTER TABLE public.omsz_users ADD COLUMN IF NOT EXISTS can_take_general_exam BOOLEAN NOT NULL DEFAULT FALSE;\nALTER TABLE public.omsz_users ADD COLUMN IF NOT EXISTS can_take_subdept_exam BOOLEAN NOT NULL DEFAULT FALSE;\nALTER TABLE public.omsz_exam_results ADD COLUMN IF NOT EXISTS details JSONB;`}</code>
            </div>
          )}

          <div className="card p-6">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
              <div><h2 className="text-xl md:text-2xl font-extrabold">Állomány, Rangok, Dutyidő és Vizsgaengedélyek</h2><p className="text-sm text-slate-500">Heti és összesített dutyperc írása, egyenkénti/összesített 0-zása és külön OOC / IC éles vizsgák engedélyezése.</p></div>
              <div className="flex flex-wrap gap-2">
                <button onClick={onResetAllWeeklyDuty} className="inline-flex items-center justify-center gap-1.5 px-3.5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold rounded-lg"><Icons.Refresh c="w-4 h-4" />Heti duty nullázása (mind)</button>
                <button onClick={onResetAllTotalDuty} className="inline-flex items-center justify-center gap-1.5 px-3.5 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-extrabold rounded-lg"><Icons.Refresh c="w-4 h-4" />Összesített duty nullázása (mind)</button>
                <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Keresés..." className="inp sm:w-52 py-1.5" />
              </div>
            </div>

            <form onSubmit={async (e) => {
              e.preventDefault();
              if (!nu.name.trim() || !nu.username.trim() || !nu.password.trim()) { alert("Add meg a nevet, felhasználónevet és jelszót!"); return; }
              const un = nu.username.trim().toLowerCase();
              if (users.some((u) => u.username.toLowerCase() === un)) { alert("Foglalt felhasználónév!"); return; }
              if (await onAddUser({ id: "u-" + Date.now(), name: nu.name.trim(), username: un, password: nu.password.trim(), badgeNumber: nu.badgeNumber.trim() || `OMSZ-${Math.floor(100 + Math.random() * 899)}`, role: nu.role, dutyMinutes: 0, totalDutyMinutes: 0, warnings: 0, canTakeOocExam: false, canTakeIcExam: false, canTakeSubdeptExam: false })) {
                setNu({ name: "", username: "", password: "", badgeNumber: "", role: "mentos" });
              }
            }} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 p-4 mb-6 bg-slate-50 rounded-xl border">
              <input type="text" placeholder="IC Név" value={nu.name} onChange={(e) => setNu({ ...nu, name: e.target.value })} className="inp bg-white" required />
              <input type="text" placeholder="Felhasználónév" value={nu.username} onChange={(e) => setNu({ ...nu, username: e.target.value })} className="inp bg-white" required />
              <input type="text" placeholder="Jelszó" value={nu.password} onChange={(e) => setNu({ ...nu, password: e.target.value })} className="inp bg-white" required />
              <input type="text" placeholder="Jelvény" value={nu.badgeNumber} onChange={(e) => setNu({ ...nu, badgeNumber: e.target.value })} className="inp bg-white" />
              <select value={nu.role} onChange={(e) => setNu({ ...nu, role: e.target.value })} className="inp bg-white font-medium">{Object.values(ROLES).map((r) => <option key={r.id} value={r.id}>{r.label}</option>)}</select>
              <button type="submit" className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg">+ Tag felvétele</button>
            </form>

            <div className="overflow-x-auto rounded-xl border border-slate-200">
              <table className="w-full text-left border-collapse">
                <thead><tr className="bg-slate-900 text-white text-xs uppercase"><th className="py-3 px-3">Jelvény</th><th className="py-3 px-3">IC Név</th><th className="py-3 px-3">Jelszó</th><th className="py-3 px-3">Heti Dutyperc</th><th className="py-3 px-3">Összes (3.200 p)</th><th className="py-3 px-3">Vizsgaengedélyek</th><th className="py-3 px-3">Figy.</th><th className="py-3 px-3">Rang</th><th className="py-3 px-3 text-right">Törlés</th></tr></thead>
                <tbody className="divide-y divide-slate-200 text-sm">
                  {filtered.map((u) => (
                    <tr key={u.id} className="hover:bg-slate-50">
                      <td className="py-3 px-3 font-mono text-xs font-bold">{u.badgeNumber}</td>
                      <td className="py-3 px-3"><div className="font-bold">{u.name}</div><div className="text-xs text-slate-400">@{u.username}</div></td>
                      <td className="py-3 px-3">
                        {pwdId === u.id ? (
                          <div className="flex gap-1"><input type="text" value={pwdVal} onChange={(e) => setPwdVal(e.target.value)} className="w-20 px-2 py-1 text-xs border rounded" /><button onClick={async () => { if (pwdVal.trim()) { await onUpdateUserField(u.id, { password: pwdVal.trim() }); setPwdId(null); } }} className="px-2 py-1 bg-emerald-600 text-white text-xs font-bold rounded">OK</button></div>
                        ) : <div className="flex items-center gap-1"><code className="text-xs bg-slate-100 px-2 py-0.5 rounded">{u.password}</code><button onClick={() => { setPwdId(u.id); setPwdVal(u.password); }} className="text-slate-400 hover:text-indigo-600"><Icons.Key c="w-3.5 h-3.5" /></button></div>}
                      </td>
                      <td className="py-3 px-3">
                        <div className="space-y-1 min-w-[230px]">
                          <div className="flex items-center gap-1.5">
                            <input type="number" min="0" value={wIn[u.id] !== undefined ? wIn[u.id] : String(u.dutyMinutes || 0)} onChange={(e) => setWIn((p) => ({ ...p, [u.id]: e.target.value }))} className="w-20 px-2 py-1 text-xs border rounded-lg font-semibold" />
                            <button type="button" onClick={async () => { const raw = wIn[u.id] !== undefined ? wIn[u.id] : String(u.dutyMinutes || 0); const v = parseInt(raw, 10); if (isNaN(v) || v < 0) return; if (await onSaveWeeklyDuty(u, v)) { setWIn((p) => { const n = { ...p }; delete n[u.id]; return n; }); setSavedId(u.id); setTimeout(() => setSavedId(null), 1500); } }} className="px-2.5 py-1 bg-slate-900 hover:bg-red-600 text-white text-xs font-bold rounded-lg">Mentés</button>
                            <button type="button" onClick={async () => { if (window.confirm(`Nullázod ${u.name} heti dutypercét?`) && await onResetSingleWeeklyDuty(u)) { setWIn((p) => { const n = { ...p }; delete n[u.id]; return n; }); setSavedId(u.id); setTimeout(() => setSavedId(null), 1500); } }} className="px-2 py-1 bg-amber-100 hover:bg-amber-500 text-amber-900 text-xs font-bold rounded-lg">0-zás</button>
                          </div>
                          <div className="text-[11px] font-bold"><span className={u.dutyMinutes >= WEEKLY_DUTY_MIN ? "text-emerald-700" : "text-amber-700"}>Mentve: {fmtN(u.dutyMinutes)} p</span> {savedId === u.id && <span className="text-emerald-600 ml-1">✓</span>}</div>
                        </div>
                      </td>
                      <td className="py-3 px-3 text-xs whitespace-nowrap">
                        <div className="flex items-center justify-between gap-2">
                          <div><div className="font-bold">{fmtN(u.totalDutyMinutes)} p</div><div className="text-slate-500">{fmtHrs(u.totalDutyMinutes)}</div></div>
                          <button type="button" onClick={() => { if (window.confirm(`Biztosan 0-ra állítod ${u.name} összesített (3.200 p cél) dutyidejét?`)) onResetSingleTotalDuty(u); }} title="Összesített duty nullázása" className="px-2 py-1 bg-red-100 hover:bg-red-600 text-red-700 hover:text-white text-[11px] font-extrabold rounded-lg">0-zás</button>
                        </div>
                      </td>
                      <td className="py-3 px-3">
                        <div className="flex flex-col gap-1 min-w-[135px]">
                          <button onClick={() => onUpdateUserField(u.id, { canTakeOocExam: !u.canTakeOocExam })} className={`px-2 py-1 rounded text-[11px] font-bold text-left ${u.canTakeOocExam ? "bg-emerald-600 text-white" : "bg-slate-200 text-slate-700"}`}>{u.canTakeOocExam ? "✓ OOC vizsga" : "✕ OOC vizsga"}</button>
                          <button onClick={() => onUpdateUserField(u.id, { canTakeIcExam: !u.canTakeIcExam })} className={`px-2 py-1 rounded text-[11px] font-bold text-left ${u.canTakeIcExam ? "bg-sky-600 text-white" : "bg-slate-200 text-slate-700"}`}>{u.canTakeIcExam ? "✓ IC vizsga" : "✕ IC vizsga"}</button>
                          <button onClick={() => onUpdateUserField(u.id, { canTakeSubdeptExam: !u.canTakeSubdeptExam })} className={`px-2 py-1 rounded text-[11px] font-bold text-left ${u.canTakeSubdeptExam ? "bg-indigo-600 text-white" : "bg-slate-200 text-slate-700"}`}>{u.canTakeSubdeptExam ? "✓ Alosztályi" : "✕ Alosztályi"}</button>
                        </div>
                      </td>
                      <td className="py-3 px-3 whitespace-nowrap">
                        <button onClick={() => onUpdateUserField(u.id, { warnings: Math.max(0, (u.warnings || 0) - 1) })} className="w-5 h-5 bg-slate-200 rounded text-xs font-bold">-</button>
                        <span className="mx-1.5 text-xs font-bold">{u.warnings || 0}/3</span>
                        <button onClick={() => onUpdateUserField(u.id, { warnings: Math.min(3, (u.warnings || 0) + 1) })} className="w-5 h-5 bg-slate-200 rounded text-xs font-bold">+</button>
                      </td>
                      <td className="py-3 px-3"><select value={u.role} onChange={(e) => onUpdateUserField(u.id, { role: e.target.value })} className="px-2 py-1 text-xs font-bold bg-white border rounded-lg">{Object.values(ROLES).map((r) => <option key={r.id} value={r.id}>{r.label}</option>)}</select></td>
                      <td className="py-3 px-3 text-right"><button onClick={() => { if (u.id === currentUserId) { alert("Saját fiókot nem törölhetsz!"); return; } if (window.confirm(`Törlöd ${u.name} fiókját?`)) onDeleteUser(u.id); }} className="p-1.5 text-slate-400 hover:text-red-600"><Icons.Trash c="w-4 h-4" /></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const LoginScreen = ({ users, onLogin, dbStatus }) => {
      const [un, setUn] = useState("");
      const [pw, setPw] = useState("");
      const [err, setErr] = useState("");
      const submit = (e) => {
        e.preventDefault();
        const found = users.find((u) => u.username.toLowerCase() === un.trim().toLowerCase() || u.name.toLowerCase() === un.trim().toLowerCase());
        if (!found) { setErr("Nem található ilyen felhasználónév vagy IC-név!"); return; }
        if (found.password !== pw) { setErr("Hibás jelszó!"); return; }
        onLogin(found);
      };
      return (
        <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
          <div className="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div className="lg:col-span-5 bg-slate-900 text-white p-8 flex flex-col justify-between">
              <div>
                <div className="flex items-center gap-3 mb-6">
                  <div className="w-12 h-12 rounded-xl bg-red-600 flex items-center justify-center"><Icons.Cross c="w-7 h-7 text-white" /></div>
                  <div><div className="text-xs font-bold uppercase tracking-widest text-amber-400">Országos Mentőszolgálat</div><h1 className="text-xl font-extrabold">OMSZ Belső Portál</h1></div>
                </div>
                <p className="text-sm text-slate-300 leading-relaxed">Üdvözlünk a Class RPG Országos Mentőszolgálat hivatalos oktatási, szabályzati és vizsgázási rendszerében!</p>
              </div>
              <div className="mt-8 pt-4 border-t border-slate-800 flex justify-between text-[11px] text-slate-400">
                <span>Adatbázis státusz:</span>
                <span className={dbStatus === "connected" ? "text-emerald-400 font-bold" : "text-amber-400 font-bold"}>{dbStatus === "connected" ? "● Kapcsolódva" : "● Helyi tartalék"}</span>
              </div>
            </div>
            <div className="lg:col-span-7 p-8 flex flex-col justify-center space-y-5">
              <div><h2 className="text-2xl font-extrabold">Szolgálati bejelentkezés</h2><p className="text-sm text-slate-500 mt-1">Jelentkezz be a szolgálati felhasználóneveddel és jelszavaddal.</p></div>
              <form onSubmit={submit} className="space-y-4">
                {err && <div className="p-3 rounded-lg bg-red-50 border border-red-200 text-xs font-semibold text-red-700">{err}</div>}
                <div><label className="block text-xs font-bold uppercase text-slate-600 mb-1">Felhasználónév vagy IC Név</label><input type="text" value={un} onChange={(e) => { setUn(e.target.value); setErr(""); }} className="inp py-2.5" required /></div>
                <div><label className="block text-xs font-bold uppercase text-slate-600 mb-1">Jelszó</label><input type="password" value={pw} onChange={(e) => { setPw(e.target.value); setErr(""); }} className="inp py-2.5" required /></div>
                <button type="submit" className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl">Belépés a portálra</button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [loadingDb, setLoadingDb] = useState(true);
      const [syncing, setSyncing] = useState(false);
      const [dbStatus, setDbStatus] = useState("connecting");
      const [dbErrorMsg, setDbErrorMsg] = useState("");
      const [missingColsAlert, setMissingColsAlert] = useState(false);

      const [users, setUsers] = useState(INITIAL_USERS);
      const [generalRules, setGeneralRules] = useState(INITIAL_GENERAL_RULES);
      const [studyMaterial, setStudyMaterial] = useState(INITIAL_STUDY_MATERIAL);
      const [subDepts, setSubDepts] = useState(INITIAL_SUBDEPTS);
      const [lzSpots, setLzSpots] = useState(INITIAL_HELI_LZ_SPOTS);
      const [questionsByCat, setQuestionsByCat] = useState(INITIAL_QUESTIONS);
      const [examResults, setExamResults] = useState(INITIAL_RESULTS);

      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState("dashboard");
      const [examInitialTab, setExamInitialTab] = useState("practice");
      const [mobileOpen, setMobileOpen] = useState(false);

      const [devModalOpen, setDevModalOpen] = useState(false);
      const [devUnlocked, setDevUnlocked] = useState(false);

      useEffect(() => {
        const onKey = (e) => {
          if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "d") { e.preventDefault(); setDevModalOpen((p) => !p); }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      const fetchAll = useCallback(async (restore = false) => {
        if (!supabaseClient) { setDbStatus("error"); setDbErrorMsg("Supabase kliens hiba."); setLoadingDb(false); return; }
        setSyncing(true);
        try {
          const [uR, dR, qR, rR] = await Promise.all([
            supabaseClient.from("omsz_users").select("*").order("created_at", { ascending: true }),
            supabaseClient.from("omsz_documents").select("*"),
            supabaseClient.from("omsz_questions").select("*").order("sort_order", { ascending: true }),
            supabaseClient.from("omsz_exam_results").select("*").order("created_at", { ascending: false }),
          ]);
          const err = uR.error || dR.error || qR.error || rR.error;
          if (err) throw err;

          let miss = false;
          if (uR.data?.length) { const s = uR.data[0]; if (!("total_duty_minutes" in s) || !("can_take_general_exam" in s) || !("can_take_subdept_exam" in s)) miss = true; }
          if (rR.data?.length && !("details" in rR.data[0])) miss = true;
          setMissingColsAlert(miss);

          let lU = (uR.data || []).map(mapUFrom), lD = dR.data || [], lQ = qR.data || [], lRes = (rR.data || []).map(mapRFrom);
          const firstInit = lU.length === 0 && lD.length === 0;

          if (lU.length === 0) {
            let { error } = await supabaseClient.from("omsz_users").upsert(INITIAL_USERS.map((u) => mapUTo(u, true)), { onConflict: "id" });
            if (error && /total_duty_minutes|can_take_/.test(String(error.message))) { setMissingColsAlert(true); const fb = await supabaseClient.from("omsz_users").upsert(INITIAL_USERS.map((u) => mapUTo(u, false)), { onConflict: "id" }); error = fb.error; }
            if (!error) lU = INITIAL_USERS;
          }

          const dm = {}; lD.forEach((d) => { dm[d.doc_key] = d.content; });
          const upDocs = [];
          if (!dm.general_rules) { dm.general_rules = INITIAL_GENERAL_RULES; upDocs.push({ doc_key: "general_rules", content: INITIAL_GENERAL_RULES }); }
          else {
            let chg = false;
            const pCh = (dm.general_rules.chapters || []).map((c) => ({ ...c, items: (c.items || []).map((it) => it.includes("800 dutyperc") ? (chg = true, it.replace(/800 dutyperc/g, "700 dutyperc")) : it) }));
            if (chg) { dm.general_rules = { ...dm.general_rules, chapters: pCh }; upDocs.push({ doc_key: "general_rules", content: dm.general_rules }); }
          }
          if (!dm.study_material) { dm.study_material = INITIAL_STUDY_MATERIAL; upDocs.push({ doc_key: "study_material", content: INITIAL_STUDY_MATERIAL }); }
          if (!dm.heli_lz_spots) { dm.heli_lz_spots = INITIAL_HELI_LZ_SPOTS; upDocs.push({ doc_key: "heli_lz_spots", content: INITIAL_HELI_LZ_SPOTS }); }
          ["motoros", "helikopteres"].forEach((k) => {
            const dk = k === "motoros" ? "subdept_motoros" : "subdept_helikopteres";
            if (!dm[dk]) { dm[dk] = INITIAL_SUBDEPTS[k]; upDocs.push({ doc_key: dk, content: INITIAL_SUBDEPTS[k] }); }
            else if (dm[dk].publicAnnouncement === undefined || dm[dk].internalAnnouncement === undefined || dm[dk].reportTemplate === undefined) {
              dm[dk] = { ...INITIAL_SUBDEPTS[k], ...dm[dk], publicAnnouncement: dm[dk].publicAnnouncement ?? INITIAL_SUBDEPTS[k].publicAnnouncement, internalAnnouncement: dm[dk].internalAnnouncement ?? INITIAL_SUBDEPTS[k].internalAnnouncement, reportTemplate: dm[dk].reportTemplate ?? INITIAL_SUBDEPTS[k].reportTemplate };
              upDocs.push({ doc_key: dk, content: dm[dk] });
            }
          });
          if (upDocs.length) await supabaseClient.from("omsz_documents").upsert(upDocs, { onConflict: "doc_key" });

          if (lQ.length < 100 || lQ.some((r) => r.category === "altalanos")) {
            const rows = []; Object.entries(INITIAL_QUESTIONS).forEach(([cat, arr]) => arr.forEach((q, i) => rows.push(mapQTo(q, cat, i))));
            await supabaseClient.from("omsz_questions").upsert(rows, { onConflict: "id" });
            const ref = await supabaseClient.from("omsz_questions").select("*").order("sort_order", { ascending: true });
            if (!ref.error && ref.data) lQ = ref.data;
          }
          let qCat = { altalanos_ooc: [], altalanos_ic: [], motoros: [], helikopteres: [] };
          if (!lQ.length) qCat = INITIAL_QUESTIONS;
          else lQ.forEach((r) => {
            const m = mapQFrom(r);
            if (!qCat[m.category]) qCat[m.category] = [];
            qCat[m.category].push(m);
          });

          if (firstInit && !lRes.length) {
            let { error } = await supabaseClient.from("omsz_exam_results").upsert(INITIAL_RESULTS.map((r) => mapRTo(r, true)), { onConflict: "id" });
            if (error && String(error.message).includes("details")) { setMissingColsAlert(true); await supabaseClient.from("omsz_exam_results").upsert(INITIAL_RESULTS.map((r) => mapRTo(r, false)), { onConflict: "id" }); }
            lRes = INITIAL_RESULTS;
          }

          setUsers(lU); setGeneralRules(dm.general_rules); setStudyMaterial(dm.study_material);
          setSubDepts({ motoros: dm.subdept_motoros, helikopteres: dm.subdept_helikopteres });
          if (Array.isArray(dm.heli_lz_spots) && dm.heli_lz_spots.length) setLzSpots(dm.heli_lz_spots);
          setQuestionsByCat(qCat); setExamResults(lRes); setDbStatus("connected"); setDbErrorMsg("");

          if (restore) {
            const sid = localStorage.getItem(SESSION_KEY);
            if (sid) { const f = lU.find((u) => u.id === sid); if (f) setCurrentUser(f); }
          } else if (currentUser) {
            const fresh = lU.find((u) => u.id === currentUser.id);
            if (fresh) setCurrentUser(fresh);
          }
        } catch (e) { setDbStatus("error"); setDbErrorMsg(e?.message || "Adatbázis hiba."); }
        finally { setSyncing(false); setLoadingDb(false); }
      }, [currentUser]);

      useEffect(() => { fetchAll(true); }, []);
      useEffect(() => {
        if (!currentUser) return;
        const r = currentUser.role;
        if (activeTab === "motoros" && !canSeeSubDeptMenu(r, "motoros")) setActiveTab("dashboard");
        if (activeTab === "helikopteres" && !canSeeSubDeptMenu(r, "helikopteres")) setActiveTab("dashboard");
        if (activeTab === "felhasznalok" && !canManageUsers(r)) setActiveTab("dashboard");
      }, [currentUser, activeTab]);

      const saveDoc = async (k, c) => { setSyncing(true); const { error } = await supabaseClient.from("omsz_documents").upsert({ doc_key: k, content: c, updated_at: new Date().toISOString() }, { onConflict: "doc_key" }); setSyncing(false); if (error) alert(error.message); };
      const updateUserF = async (uid, f) => {
        const target = users.find((u) => u.id === uid);
        const nextOoc = f.canTakeOocExam !== undefined ? f.canTakeOocExam : Boolean(target?.canTakeOocExam);
        const nextIc = f.canTakeIcExam !== undefined ? f.canTakeIcExam : Boolean(target?.canTakeIcExam);

        setUsers((p) => p.map((u) => u.id === uid ? { ...u, ...f } : u));
        if (currentUser?.id === uid) setCurrentUser((p) => ({ ...p, ...f }));

        const dbF = {};
        if (f.role !== undefined) dbF.role = f.role;
        if (f.password !== undefined) dbF.password = f.password;
        if (f.warnings !== undefined) dbF.warnings = f.warnings;
        if (f.dutyMinutes !== undefined) dbF.duty_minutes = f.dutyMinutes;
        if (f.totalDutyMinutes !== undefined) dbF.total_duty_minutes = f.totalDutyMinutes;
        if (f.canTakeOocExam !== undefined || f.canTakeIcExam !== undefined) {
          dbF.can_take_general_exam = Boolean(nextOoc || nextIc);
        }
        if (f.canTakeSubdeptExam !== undefined) dbF.can_take_subdept_exam = f.canTakeSubdeptExam;

        setSyncing(true);
        const { error } = await supabaseClient.from("omsz_users").update(dbF).eq("id", uid);
        setSyncing(false);
        if (error) { if (/total_duty_minutes|can_take_/.test(String(error.message))) setMissingColsAlert(true); else alert(error.message); }
      };

      const resetSingleTotalDuty = async (u) => {
        setSyncing(true);
        const { error } = await supabaseClient.from("omsz_users").update({ total_duty_minutes: 0 }).eq("id", u.id);
        setSyncing(false);
        if (error) { if (String(error.message).includes("total_duty_minutes")) setMissingColsAlert(true); else alert(error.message); return false; }
        setUsers((p) => p.map((x) => x.id === u.id ? { ...x, totalDutyMinutes: 0 } : x));
        if (currentUser?.id === u.id) setCurrentUser((p) => ({ ...p, totalDutyMinutes: 0 }));
        return true;
      };

      const resetAllTotalDuty = async () => {
        if (!window.confirm("Biztosan nullázod az ÖSSZES tag összesített (3.200 p cél) dutyidejét?")) return;
        setSyncing(true);
        const { error } = await supabaseClient.from("omsz_users").update({ total_duty_minutes: 0 }).neq("id", "___");
        setSyncing(false);
        if (error) { if (String(error.message).includes("total_duty_minutes")) setMissingColsAlert(true); else alert(error.message); return; }
        setUsers((p) => p.map((x) => ({ ...x, totalDutyMinutes: 0 })));
        setCurrentUser((p) => (p ? { ...p, totalDutyMinutes: 0 } : p));
        alert("Minden tag összesített (3.200 p cél) dutyideje 0-ra állítva!");
      };

      if (loadingDb) return <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center"><div className="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center mb-4 animate-pulse"><Icons.Cross c="w-8 h-8" /></div><h2 className="font-bold">Csatlakozás az OMSZ Supabase adatbázishoz...</h2></div>;
      if (!currentUser) return <div>{dbStatus === "error" && <div className="bg-red-600 text-white px-4 py-2 text-xs text-center">⚠ {dbErrorMsg}</div>}<LoginScreen users={users} onLogin={(u) => { setCurrentUser(u); localStorage.setItem(SESSION_KEY, u.id); setActiveTab("dashboard"); }} dbStatus={dbStatus} /></div>;

      const rInfo = ROLES[currentUser.role] || ROLES.mentos;
      const nav = [
        { id: "dashboard", label: "Irányítópult", icon: Icons.Dashboard, vis: true },
        { id: "szabalyzat", label: "Általános Szabályzat", icon: Icons.Shield, vis: true },
        { id: "tananyag", label: "Oktatási Kézikönyv", icon: Icons.Book, vis: true },
        { id: "motoros", label: "Mentőmotoros Alosztály", icon: Icons.Bike, vis: canSeeSubDeptMenu(currentUser.role, "motoros"), badge: currentUser.role === "mentos" ? "Felhívás" : "Alosztály" },
        { id: "helikopteres", label: "Mentőhelikopteres Alosztály", icon: Icons.Helicopter, vis: canSeeSubDeptMenu(currentUser.role, "helikopteres"), badge: currentUser.role === "mentos" ? "Felhívás" : "Alosztály" },
        { id: "vizsgak", label: "Vizsgarendszer", icon: Icons.Clip, vis: true },
        { id: "dutystats", label: "Duty Statisztika", icon: Icons.Chart, vis: true },
        { id: "felhasznalok", label: "Felhasználók kezelése", icon: Icons.Users, vis: canManageUsers(currentUser.role), badge: "Admin" },
      ];
      const totQ = (questionsByCat.altalanos_ooc || []).length + (questionsByCat.altalanos_ic || []).length + (questionsByCat.motoros || []).length + (questionsByCat.helikopteres || []).length;

      return (
        <div className="min-h-screen flex bg-[#F8FAFC] text-[#0F172A]">
          <SecretDevModal isOpen={devModalOpen} onClose={() => setDevModalOpen(false)} devUnlocked={devUnlocked} onUnlock={() => setDevUnlocked(true)} lzSpots={lzSpots} onSaveLzSpots={(next) => { setLzSpots(next); saveDoc("heli_lz_spots", next); }} />

          {mobileOpen && <div onClick={() => setMobileOpen(false)} className="fixed inset-0 bg-slate-950/60 z-30 lg:hidden" />}
          <aside className={`fixed inset-y-0 left-0 z-40 w-72 bg-[#0F172A] text-white flex flex-col transition-transform duration-200 lg:translate-x-0 ${mobileOpen ? "translate-x-0" : "-translate-x-full"}`}>
            <div className="h-16 px-5 flex items-center justify-between border-b border-slate-800 shrink-0">
              <div className="flex items-center gap-3"><div className="w-9 h-9 rounded-lg bg-[#DC2626] flex items-center justify-center"><Icons.Cross c="w-5 h-5" /></div><div><div className="text-sm font-extrabold leading-none">OMSZ PORTÁL</div><div className="text-[10px] font-semibold uppercase tracking-widest text-[#F59E0B] mt-0.5">Országos Mentőszolgálat</div></div></div>
              <button onClick={() => setMobileOpen(false)} className="lg:hidden text-slate-400"><Icons.X c="w-5 h-5" /></button>
            </div>
            <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
              {nav.filter((i) => i.vis).map((it) => {
                const Ic = it.icon, act = activeTab === it.id;
                return (
                  <button key={it.id} onClick={() => { setActiveTab(it.id); setMobileOpen(false); }} className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-semibold ${act ? "bg-[#DC2626] text-white" : "text-slate-300 hover:bg-slate-800 hover:text-white"}`}>
                    <div className="flex items-center gap-3"><Ic c="w-5 h-5 shrink-0" /><span className="truncate">{it.label}</span></div>
                    {it.badge && <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${act ? "bg-white/20 text-white" : "bg-slate-800 text-[#F59E0B]"}`}>{it.badge}</span>}
                  </button>
                );
              })}
            </nav>
            <div className="p-4 border-t border-slate-800 space-y-2">
              <button onClick={() => setDevModalOpen(true)} className="w-full inline-flex items-center justify-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[11px] font-semibold text-slate-400 hover:text-amber-400"><Icons.Code c="w-3.5 h-3.5" />Dev Studio</button>
              {currentUser.role === "vezetoseg" && (
                <button onClick={async () => {
                  if (!window.confirm("Visszaállítod az alapértelmezett szabályzatokat (beleértve a HEMS belső szabályzatot) és a 100 kérdést (OOC & IC)?")) return;
                  setSyncing(true);
                  await supabaseClient.from("omsz_documents").upsert([{ doc_key: "general_rules", content: INITIAL_GENERAL_RULES }, { doc_key: "study_material", content: INITIAL_STUDY_MATERIAL }, { doc_key: "subdept_motoros", content: INITIAL_SUBDEPTS.motoros }, { doc_key: "subdept_helikopteres", content: INITIAL_SUBDEPTS.helikopteres }], { onConflict: "doc_key" });
                  await supabaseClient.from("omsz_questions").delete().neq("id", "___");
                  const rows = []; Object.entries(INITIAL_QUESTIONS).forEach(([cat, arr]) => arr.forEach((q, i) => rows.push(mapQTo(q, cat, i))));
                  await supabaseClient.from("omsz_questions").insert(rows);
                  setGeneralRules(INITIAL_GENERAL_RULES); setStudyMaterial(INITIAL_STUDY_MATERIAL); setSubDepts(INITIAL_SUBDEPTS); setQuestionsByCat(INITIAL_QUESTIONS); setSyncing(false); alert("Visszaállítva!");
                }} className="w-full inline-flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-slate-800 text-xs font-semibold text-slate-300"><Icons.Refresh c="w-3.5 h-3.5" />Alaphelyzetbe állítás</button>
              )}
              <button onClick={() => { setCurrentUser(null); localStorage.removeItem(SESSION_KEY); }} className="w-full inline-flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-slate-800/70 hover:text-red-400 text-xs font-bold text-slate-300"><Icons.Out c="w-4 h-4" />Kijelentkezés</button>
            </div>
          </aside>

          <div className="flex-1 lg:pl-72 flex flex-col min-w-0">
            <header className="sticky top-0 z-20 h-16 bg-white/95 backdrop-blur border-b border-slate-200 px-4 md:px-6 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button onClick={() => setMobileOpen(true)} className="lg:hidden p-2 rounded-lg text-slate-600"><Icons.Menu c="w-5 h-5" /></button>
                <div className="flex items-center gap-2 text-xs font-semibold text-slate-600">
                  <span className={`w-2 h-2 rounded-full ${syncing ? "bg-amber-500 animate-ping" : dbStatus === "connected" ? "bg-emerald-500" : "bg-red-600"}`}></span>
                  <span>{syncing ? "Szinkronizálás..." : dbStatus === "connected" ? "Supabase csatlakozva" : "Hiba"}</span>
                  <button onClick={() => fetchAll(false)} className="p-1 text-slate-400 hover:text-slate-700" title="Frissítés"><Icons.Refresh c="w-3.5 h-3.5" /></button>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div className="text-right"><div className="text-sm font-bold leading-tight">{currentUser.name}</div><div className="text-[11px] text-slate-500 font-mono">{currentUser.badgeNumber}</div></div>
                <span className={`px-2.5 py-1 rounded-full text-xs font-bold border ${rInfo.badgeClass}`}>{rInfo.label}</span>
              </div>
            </header>

            <main className="flex-1 p-4 md:p-6 lg:p-8 max-w-7xl w-full mx-auto">
              {activeTab === "dashboard" && (
                <div className="space-y-6">
                  <div className="bg-[#0F172A] text-white rounded-2xl p-6 md:p-8 shadow-md flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div className="space-y-2 max-w-2xl">
                      <div className="inline-flex px-3 py-1 rounded-full bg-white/10 text-[#F59E0B] text-xs font-bold">Aktív rang: {rInfo.label}</div>
                      <h1 className="text-2xl md:text-3xl font-extrabold">Üdvözlünk a szolgálatban, {currentUser.name}!</h1>
                      <p className="text-sm text-slate-300">{rInfo.shortDesc}.</p>
                    </div>
                    <div className="flex flex-wrap gap-3 shrink-0">
                      <button onClick={() => { setExamInitialTab("practice"); setActiveTab("vizsgak"); }} className="px-4 py-2.5 bg-white text-slate-900 rounded-xl text-sm font-bold">Gyakorló vizsga</button>
                      <button onClick={() => { setExamInitialTab("official"); setActiveTab("vizsgak"); }} className="px-4 py-2.5 bg-[#DC2626] text-white rounded-xl text-sm font-bold">Éles vizsga (OOC / IC)</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="card p-5"><div className="text-xs font-bold uppercase text-slate-400">Frakciószabályzat</div><div className="text-2xl font-extrabold mt-1">{generalRules.chapters.length} fejezet</div></div>
                    <div className="card p-5"><div className="text-xs font-bold uppercase text-slate-400">Oktatási Kézikönyv</div><div className="text-2xl font-extrabold mt-1">{studyMaterial.chapters.length} fejezet</div></div>
                    <div className="card p-5"><div className="text-xs font-bold uppercase text-slate-400">Saját heti duty</div><div className={`text-2xl font-extrabold mt-1 ${(currentUser.dutyMinutes || 0) >= WEEKLY_DUTY_MIN ? "text-emerald-600" : "text-amber-600"}`}>{fmtN(currentUser.dutyMinutes || 0)} perc</div><div className="text-xs text-slate-500">Minimum: {WEEKLY_DUTY_MIN} perc</div></div>
                    <div className="card p-5"><div className="text-xs font-bold uppercase text-slate-400">Kérdésbank (OOC & IC)</div><div className="text-2xl font-extrabold text-emerald-600 mt-1">{totQ} kérdés</div></div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div onClick={() => setActiveTab("szabalyzat")} className="card p-6 hover:border-red-400 cursor-pointer"><Icons.Shield c="w-7 h-7 text-red-600 mb-3" /><h3 className="text-lg font-bold">Általános Szabályzat</h3><p className="text-sm text-slate-500 mt-1">Frakciószabályzat, rádiózás, járművek, hívások.</p></div>
                    <div onClick={() => setActiveTab("tananyag")} className="card p-6 hover:border-amber-400 cursor-pointer"><Icons.Book c="w-7 h-7 text-amber-600 mb-3" /><h3 className="text-lg font-bold">Oktatási Kézikönyv</h3><p className="text-sm text-slate-500 mt-1">Sebellátás, törések, gyógyszertár, vitális paraméterek.</p></div>
                    <div onClick={() => setActiveTab("dutystats")} className="card p-6 hover:border-emerald-400 cursor-pointer"><Icons.Chart c="w-7 h-7 text-emerald-600 mb-3" /><h3 className="text-lg font-bold">Duty Statisztika</h3><p className="text-sm text-slate-500 mt-1">Állományi összegzett dutyidő és {WEEKLY_DUTY_MIN} perces célkövetés.</p></div>
                    {canSeeSubDeptMenu(currentUser.role, "motoros") && (
                      <div onClick={() => setActiveTab("motoros")} className="card p-6 hover:border-amber-500 cursor-pointer">
                        <Icons.Bike c="w-7 h-7 text-amber-600 mb-3" />
                        <div className="flex justify-between items-center"><h3 className="text-lg font-bold">Mentőmotoros Alosztály</h3>{currentUser.role === "mentos" && <span className="px-2 py-0.5 bg-amber-100 text-amber-900 text-[10px] font-bold rounded">Felhívás</span>}</div>
                        <p className="text-sm text-slate-500 mt-1">{currentUser.role === "mentos" ? "Nyilvános jelentkezési felhívás megtekintése." : "Belső szabályzat, felhívás és jelentésminta."}</p>
                      </div>
                    )}
                    {canSeeSubDeptMenu(currentUser.role, "helikopteres") && (
                      <div onClick={() => setActiveTab("helikopteres")} className="card p-6 hover:border-sky-500 cursor-pointer">
                        <Icons.Helicopter c="w-7 h-7 text-sky-600 mb-3" />
                        <div className="flex justify-between items-center"><h3 className="text-lg font-bold">Mentőhelikopteres Alosztály</h3>{currentUser.role === "mentos" && <span className="px-2 py-0.5 bg-sky-100 text-sky-900 text-[10px] font-bold rounded">Felhívás</span>}</div>
                        <p className="text-sm text-slate-500 mt-1">{currentUser.role === "mentos" ? "Nyilvános jelentkezési felhívás megtekintése." : "HEMS belső szabályzat, interaktív GTA V térkép és jelentésgenerátor."}</p>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {activeTab === "szabalyzat" && <DocumentViewer docData={generalRules} onUpdateDoc={(u) => { setGeneralRules(u); saveDoc("general_rules", u); }} canEdit={canEditGeneral(currentUser.role)} />}
              {activeTab === "tananyag" && <DocumentViewer docData={studyMaterial} onUpdateDoc={(u) => { setStudyMaterial(u); saveDoc("study_material", u); }} canEdit={canEditGeneral(currentUser.role)} />}
              {activeTab === "motoros" && canSeeSubDeptMenu(currentUser.role, "motoros") && <SubDepartmentView deptData={subDepts.motoros} currentUser={currentUser} lzSpots={lzSpots} onUpdateDept={(u) => { setSubDepts((p) => ({ ...p, motoros: u })); saveDoc("subdept_motoros", u); }} onOpenExam={() => { setExamInitialTab("official"); setActiveTab("vizsgak"); }} />}
              {activeTab === "helikopteres" && canSeeSubDeptMenu(currentUser.role, "helikopteres") && <SubDepartmentView deptData={subDepts.helikopteres} currentUser={currentUser} lzSpots={lzSpots} onUpdateDept={(u) => { setSubDepts((p) => ({ ...p, helikopteres: u })); saveDoc("subdept_helikopteres", u); }} onOpenExam={() => { setExamInitialTab("official"); setActiveTab("vizsgak"); }} />}
              {activeTab === "dutystats" && <DutyStatistics users={users} currentUser={currentUser} onResetSingleTotalDuty={resetSingleTotalDuty} onResetAllTotalDuty={resetAllTotalDuty} />}

              {activeTab === "vizsgak" && (
                <ExamSystem
                  currentUser={currentUser} users={users} questionsByCat={questionsByCat} examResults={examResults} missingColsAlert={missingColsAlert} initialSubTab={examInitialTab}
                  onSaveQuestion={async (cat, q, isEd) => { setQuestionsByCat((p) => ({ ...p, [cat]: isEd ? p[cat].map((x) => x.id === q.id ? q : x) : [...(p[cat] || []), q] })); setSyncing(true); await supabaseClient.from("omsz_questions").upsert(mapQTo(q, cat, q.sortOrder || 0), { onConflict: "id" }); setSyncing(false); }}
                  onDeleteQuestion={async (cat, id) => { setQuestionsByCat((p) => ({ ...p, [cat]: p[cat].filter((x) => x.id !== id) })); setSyncing(true); await supabaseClient.from("omsz_questions").delete().eq("id", id); setSyncing(false); }}
                  onAddResult={async (rec) => { setExamResults((p) => [rec, ...p]); setSyncing(true); let { error } = await supabaseClient.from("omsz_exam_results").insert(mapRTo(rec, true)); if (error && String(error.message).includes("details")) { setMissingColsAlert(true); await supabaseClient.from("omsz_exam_results").insert(mapRTo(rec, false)); } setSyncing(false); }}
                  onDeleteResult={async (id) => { setExamResults((p) => p.filter((r) => r.id !== id)); setSyncing(true); await supabaseClient.from("omsz_exam_results").delete().eq("id", id); setSyncing(false); }}
                  onConsumeExamPermission={(uid, cat) => updateUserF(uid, cat === "altalanos_ooc" ? { canTakeOocExam: false } : cat === "altalanos_ic" ? { canTakeIcExam: false } : { canTakeSubdeptExam: false })}
                  onUpdateUserField={updateUserF}
                />
              )}

              {activeTab === "felhasznalok" && canManageUsers(currentUser.role) && (
                <UserManagement
                  users={users} currentUserId={currentUser.id} missingColsAlert={missingColsAlert}
                  onAddUser={async (nu) => { setSyncing(true); let { error } = await supabaseClient.from("omsz_users").insert(mapUTo(nu, true)); if (error && /total_duty_minutes|can_take_/.test(String(error.message))) { setMissingColsAlert(true); const fb = await supabaseClient.from("omsz_users").insert(mapUTo(nu, false)); error = fb.error; } setSyncing(false); if (error) { alert(error.message); return false; } setUsers((p) => [...p, nu]); return true; }}
                  onUpdateUserField={updateUserF}
                  onSaveWeeklyDuty={async (u, val) => { const nTot = Math.max(0, (Number(u.totalDutyMinutes) || 0) + (val - (Number(u.dutyMinutes) || 0))); setSyncing(true); let { error } = await supabaseClient.from("omsz_users").update({ duty_minutes: val, total_duty_minutes: nTot }).eq("id", u.id); if (error && String(error.message).includes("total_duty_minutes")) { setMissingColsAlert(true); const fb = await supabaseClient.from("omsz_users").update({ duty_minutes: val }).eq("id", u.id); error = fb.error; } setSyncing(false); if (error) { alert(error.message); return false; } setUsers((p) => p.map((x) => x.id === u.id ? { ...x, dutyMinutes: val, totalDutyMinutes: nTot } : x)); if (currentUser.id === u.id) setCurrentUser((p) => ({ ...p, dutyMinutes: val, totalDutyMinutes: nTot })); return true; }}
                  onResetSingleWeeklyDuty={async (u) => { setSyncing(true); const { error } = await supabaseClient.from("omsz_users").update({ duty_minutes: 0 }).eq("id", u.id); setSyncing(false); if (error) { alert(error.message); return false; } setUsers((p) => p.map((x) => x.id === u.id ? { ...x, dutyMinutes: 0 } : x)); if (currentUser.id === u.id) setCurrentUser((p) => ({ ...p, dutyMinutes: 0 })); return true; }}
                  onResetAllWeeklyDuty={async () => { if (!window.confirm("Biztosan nullázod az ÖSSZES tag heti dutypercét?")) return; setSyncing(true); const { error } = await supabaseClient.from("omsz_users").update({ duty_minutes: 0 }).neq("id", "___"); setSyncing(false); if (error) { alert(error.message); return; } setUsers((p) => p.map((x) => ({ ...x, dutyMinutes: 0 }))); setCurrentUser((p) => ({ ...p, dutyMinutes: 0 })); alert("Minden tag heti dutyperce 0-ra állítva!"); }}
                  onResetSingleTotalDuty={resetSingleTotalDuty}
                  onResetAllTotalDuty={resetAllTotalDuty}
                  onDeleteUser={async (uid) => { setUsers((p) => p.filter((x) => x.id !== uid)); setSyncing(true); await supabaseClient.from("omsz_users").delete().eq("id", uid); setSyncing(false); }}
                />
              )}
            </main>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
