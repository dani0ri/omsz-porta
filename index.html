        publicAnnouncement: "TAGFELVÉTEL NYITVA! A Mentőmotoros Alosztály várja a gyors reagálású Mentős állománytagok jelentkezését.\n\nJelentkezési feltételek:\n• Legalább Mentőápoló rendfokozat és érvényes „A” kategóriás jogosítvány\n• Minimum 2 hét aktív frakciótagság, figyelmeztetésmentes előélet\n• Sikeres elméleti és vezetéstechnikai felvételi vizsga\n\nJelentkezéshez keresd az Alosztályvezetőt rádión vagy szolgálati eligazításon!",
        internalAnnouncement: "BELSŐ ELIGAZÍTÁS: Pénteken 19:00-kor kötelező vezetéstechnikai és TRIAGE gyakorlat a Kórház hátsó udvarán. Minden motoros egység ellenőrizze a gumik nyomását és az oldaldobozok AED készletét szolgálatfelvétel előtt!",
        reportTemplate: "=== OMSZ MENTŐMOTOROS JELENTÉS ===\nEgység: [OMSZ-M0X / Név]\nDátum: [ÉÉÉÉ.HH.NN. ÓÓ:PP]\nHelyszín: [Utca / Kerület / Mérföldkő]\nSérült(ek): [Sérültek száma, állapota / TRIAGE]\nEllátás: [Helyszíni stabilizálás, átadó esetkocsi]\nMegjegyzés: [Forgalmi akadály, felhasznált készlet]",
        chapters: [
          { id: "mot-1", title: "1. Alosztályi szolgálati és felszerelési szabályzat", description: "A gyorsbeavatkozó motoros egységek szolgálatellátásának előírásai.", items: ["Mentőmotoros szolgálatot kizárólag érvényes „A” kategóriás jogosítvánnyal és sikeres alosztályi vizsgával rendelkező állománytag teljesíthet.", "Szolgálat közben kötelező a teljes védőfelszerelés (bukósisak, gerincvédő, motoros kesztyű, protektoros ruházat) viselése.", "A mentőmotor elsődleges feladata a gyors helyszínre érkezés és a beteg stabilizálása (első beavatkozó egység), szállításra nem alkalmas!", "Amennyiben a beteg kórházi szállítást igényel, a motoros egység rádión azonnal esetkocsit vagy mentőgépkocsit kér a helyszínre, és átadásig biztosítja a beteget.", "Szélsőséges időjárási körülmények között (jeges út, heves vihar) az alosztályvezető elrendelheti a motoros szolgálat felfüggesztését."] },
          { id: "mot-2", title: "2. Mentőmotoros szakmai tananyag és protokoll", description: "Elsődleges ABCDE állapotfelmérés és korlátozott készletgazdálkodás.", items: ["Oldaldobozok tartalma: kompakt defibrillátor (AED), hordozható oxigénpalack, vérzéscsillapító csomag (nyomókötés, tourniquet), vénabiztosító szett, alapvető i.v. gyógyszerek (Tonogen, Algopyrin, Exacyl, Isolyte 500 ml).", "Dugóban vagy szűk belvárosi utcákban a megkülönböztető hang- és fényjelzés folyamatos használata mellett legfeljebb +20 km/h sebességkülönbséggel szabad a kocsisorok között elhaladni.", "Tömegbaleset (MCI) esetén a motoros egység elsőként végezheti el a TRIAGE (osztályozás) feladatát a többi egység kiérkezéséig.", "A motor leállításakor a járművet úgy kell pozicionálni, hogy védje a beavatkozó mentőst a forgalomtól, de ne akadályozza a később érkező mentőautó megállását."] }
        ]
      },
      helikopteres: {

        metadata: "Alosztályi kiadvány | Hatályos: 2026.11.01. | Kizárólag a Légimentő egység tagjainak",

        internalAnnouncement: "BELSŐ LÉGI KÖZLEMÉNY: Szombaton 20:00-kor éjszakai leszállózóna-biztosítási és műszeres megközelítési gyakorlat a vidéki térségben. Felszállás előtt minden egység végezze el a kötelező FOD checket és tesztelje a helipad-rádiót!",
        reportTemplate: "=== OMSZ LÉGIMENTŐ (HEMS) JELENTÉS ===\nEgység: [ALFA-1 / Pilóta & Mentőtiszt]\nDátum: [ÉÉÉÉ.HH.NN. ÓÓ:PP]\nHelyszín: [Leszállózóna / Térség]\nSérült(ek): [Állapot, vitális paraméterek]\nEllátás: [Földi stabilizálás + légi szállítás, SBAR átadás]\nMegjegyzés: [Időjárás, leszállás, üzemanyag]",
        chapters: [
          {
            id: "hel-1",
            title: "1. Általános rendelkezések és az alosztály célja",
            description: "A Légi Mentőszolgálat (HEMS) rendeltetése, alapelvei és riasztási kritériumai.",
            items: [
              "Alapelv: A Légi Mentőszolgálat (Helicopter Emergency Medical Services – HEMS) az Országos Mentőszolgálat (OMSZ) kiemelt, különleges beavatkozó egysége. Feladata a távoli, nehezen megközelíthető helyszínek gyors elérése, a kritikus állapotú sérültek emelt szintű helyszíni stabilizálása és biztonságos légi kórházi szállítása.",
              "Indokolatlan bevetések tilalma: A mentőhelikopter kizárólag szakmailag indokolt sürgősségi bevetésekre vehető igénybe; rutinszerű, alacsony prioritású betegszállításra vagy egyszerű személyszállításra használni szigorúan tilos. Minden bevetésen kötelező a legmagasabb színvonalú, protokoll szerinti helyszíni és fedélzeti egészségügyi ellátás lefolytatása.",
              "Riasztási kritériumok – Súlyos közlekedési balesetek: Súlyos, nagy sebességű autópályás vagy külterületi közlekedési balesetek (KKV).",
              "Riasztási kritériumok – Áthatoló és robbanásos sérülések: Lőtt, szúrt vagy robbanásos sérülésekkel járó súlyos esetek.",
              "Riasztási kritériumok – Tömegbalesetek: Több sérültes tömegbalesetek (kárhelyszín-támogatás és légi triázs).",
              "Riasztási kritériumok – Nehezen megközelíthető terep: Földi mentőegységekkel nehezen vagy lassan megközelíthető helyszínek (hegyvidék, erdős terület, szigetek, vízközeli területek).",
              "Riasztási kritériumok – Szekunder transzport: Kritikus állapotú páciensek sürgős intézményközi átszállítása (szekunder transzport), amennyiben a földi szállítás az életkilátásokat rontaná."
            ]

          {

            description: "A HEMS egység kötelező 2 fős személyzeti összetétele és munkamegosztása.",
            items: [

              "Légijármű-parancsnok (PIC): A légijármű kizárólagos parancsnoka. Felelős a helikopter vezetéséért, a légügyi és repülésbiztonsági előírások betartásáért, az útvonaltervezésért, a biztonságos leszállóhely (LZ) kiválasztásáért, valamint a gép műszaki állapotának (üzemanyag, rotorok, fedélzeti műszerek) folyamatos ellenőrzéséért.",

            ]
          },
          {

              "Leszállózóna (LZ) biztosítása: A parancsnok csak olyan területre szállhat le, amely megfelelő méretű, szilárd talajú, és mentes a veszélyes tereptárgyaktól (magasfeszültségű vezetékek, lámpaoszlopok, sűrű fák). Amennyiben a helyszínen már tartózkodnak földi egységek (ROKO, Motoros, MGK, Rendőrség), a HEMS Doctor rádión kéri tőlük a zóna biztosítását.",
              "Helyszíni munka és betegátadás: A rotorok teljes leállásáig vagy a parancsnok egyértelmű jelzéséig a helikoptert megközelíteni szigorúan tilos. A beteget hordágyon rögzítve, stabilizált állapotban kell a fedélzetre emelni."
            ]

            description: "Minden éles bevetést követően a személyzet mindkét tagja köteles különálló írásos jelentést benyújtani a hivatalos elektronikus nyilvántartási rendszerbe a szolgálat leadásáig, de legkésőbb 24 órán belül:",

              "Kötelező gyakorlati rend – Havonta: Komplex traumatológiai és társszervi nagygyakorlat (Rendőrség, ROKO, Motoros egységek bevonásával)."

            items: [

              "Súlyos szabálysértések (pl. indokolatlan riasztásra való kivonulás, ellátási protokollok megszegése, szóló repülés engedély nélkül, a légijármű gondatlanságból történő megrongálása, társszervekkel szembeni tiszteletlen viselkedés): Azonnali szolgálati felfüggesztés, soron kívüli alkalmassági vizsga elrendelése vagy az alosztályból való végleges eltávolítás."
            ]
          }
        ]

        if (!el || z <= 1) return { x: 0, y: 0 };
        const maxX = el.clientWidth * (z - 1);
        const maxY = el.clientHeight * (z - 1);

        if (nextZ === 1 || !el) { setZoom(1); setPan({ x: 0, y: 0 }); return; }
        const cx = el.clientWidth / 2, cy = el.clientHeight / 2, ratio = nextZ / zoom;
