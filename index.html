                  <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100">
                    {spots.map((s) => <circle key={s.id} cx={s.x} cy={s.y} r={1.1 * markerScale} fill="#38bdf8" opacity="0.8" />)}
                    <line x1={ptA.x} y1={ptA.y} x2={ptB.x} y2={ptB.y} stroke="#f59e0b" strokeWidth={0.9 * markerScale} strokeDasharray="2,1.2" />
                    <circle cx={ptA.x} cy={ptA.y} r={2.6 * markerScale} fill="#10b981" stroke="#ffffff" strokeWidth={0.7 * markerScale} />
                    <text x={ptA.x} y={ptA.y + 0.9 * markerScale} textAnchor="middle" fill="#ffffff" fontSize={2.6 * markerScale} fontWeight="bold">A</text>
                    <circle cx={ptB.x} cy={ptB.y} r={3.2 * markerScale} fill="#dc2626" stroke="#ffffff" strokeWidth={0.7 * markerScale} />
                    <text x={ptB.x} y={ptB.y + 0.9 * markerScale} textAnchor="middle" fill="#ffffff" fontSize={2.6 * markerScale} fontWeight="bold">B</text>
                  </svg>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2 text-xs">
                <div className="p-2.5 rounded-lg bg-emerald-50 border border-emerald-200"><span className="font-extrabold text-emerald-800 block">A – Felszállás:</span><span className="text-slate-700 font-semibold">{spotA.name}</span></div>
                <div className="p-2.5 rounded-lg bg-red-50 border border-red-200"><span className="font-extrabold text-red-800 block">B – Leszállózóna:</span><span className="text-slate-700 font-semibold">{spotB.name}</span></div>
              </div>
            </div>

            <div className="xl:col-span-7 space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div><label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Lajstromjel / Hívójel</label><input type="text" value={callsign} onChange={(e) => setCallsign(e.target.value)} className="inp bg-white text-xs" /></div>
                <div><label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Légi mentőorvos (HEMS Doctor)</label><input type="text" value={doctor} onChange={(e) => setDoctor(e.target.value)} className="inp bg-white text-xs" /></div>
                <div className="sm:col-span-2"><label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Riasztás jellege / indoka</label><input type="text" value={reason} onChange={(e) => setReason(e.target.value)} className="inp bg-white text-xs" /></div>
                <div><label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Felszállás / Üzemanyag</label><div className="flex gap-2"><input type="text" value={takeoffTime} onChange={(e) => setTakeoffTime(e.target.value)} placeholder="ÓÓ:PP" className="inp bg-white text-xs" /><input type="text" value={fuel} onChange={(e) => setFuel(e.target.value)} placeholder="100%" className="inp bg-white text-xs w-24" /></div></div>
                <div><label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Időjárási viszonyok</label><select value={weather} onChange={(e) => setWeather(e.target.value)} className="inp bg-white text-xs"><option>Tiszta égbolt, jó látási viszonyok, enyhe oldalszél</option><option>Borult égbolt, mérsékelt széllökések</option><option>Éjszakai repülés, korlátozott látási viszonyok</option></select></div>
                <div><label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Leszállózóna biztosítása</label><select value={lzSecurity} onChange={(e) => setLzSecurity(e.target.value)} className="inp bg-white text-xs"><option>Igen – Földi mentőegység és Rendőrség biztosította</option><option>Igen – Rendőrség biztosította</option><option>Igen – Földi mentőegység biztosította</option><option>Nem – Saját fedélzeti felderítéssel biztosítva</option></select></div>
                <div><label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Kórház / Bázis visszaérkezés</label><div className="flex gap-2"><input type="text" value={hospTime} onChange={(e) => setHospTime(e.target.value)} placeholder="Kórház ÓÓ:PP" className="inp bg-white text-xs" /><input type="text" value={baseTime} onChange={(e) => setBaseTime(e.target.value)} placeholder="Bázis ÓÓ:PP" className="inp bg-white text-xs" /></div></div>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-2">
                <div className="flex gap-2">
                  <button type="button" onClick={() => setReportRoleTab("pic")} className={`px-3.5 py-2 rounded-lg text-xs font-extrabold ${reportRoleTab === "pic" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700"}`}>Pilóta (PIC) Repülési Napló</button>
                  <button type="button" onClick={() => setReportRoleTab("doctor")} className={`px-3.5 py-2 rounded-lg text-xs font-extrabold ${reportRoleTab === "doctor" ? "bg-sky-600 text-white" : "bg-slate-100 text-slate-700"}`}>Mentőorvos (HEMS Doctor) Jegyzőkönyv</button>
                </div>
                <span className="text-xs font-semibold text-slate-500">Dátum: {todayStr} • Repült idő: {estFlightMin} p ({distKm} km)</span>
              </div>

              {reportRoleTab === "pic" ? (
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-extrabold uppercase text-slate-600">Pilóta (PIC) által kitöltött repülési jelentés</span>
                    <button type="button" onClick={() => copyToClipboard(generatedPicReport, setCopiedPic)} className={`inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-xs font-bold ${copiedPic ? "bg-emerald-600 text-white" : "bg-red-600 hover:bg-red-700 text-white"}`}>{copiedPic ? <Icons.Check c="w-3.5 h-3.5" /> : <Icons.Copy c="w-3.5 h-3.5" />}{copiedPic ? "Pilóta jelentés kimásolva!" : "Pilóta jelentés másolása"}</button>
                  </div>
                  <pre className="p-3.5 rounded-xl bg-slate-900 text-slate-100 text-[11px] sm:text-xs font-mono whitespace-pre-wrap max-h-72 overflow-y-auto leading-relaxed">{generatedPicReport}</pre>
                </div>
              ) : (
                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-sky-50/70 p-4 rounded-xl border border-sky-200">
                    <div className="sm:col-span-2 flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-sky-200/80">
                      <span className="text-[11px] font-extrabold uppercase text-sky-950">Orvosi sablonok (szakszavakkal):</span>
                      <div className="flex flex-wrap gap-1.5">
                        <button type="button" onClick={() => applyDoctorTemplate("trauma")} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${docTemplatePreset === "trauma" ? "bg-sky-700 text-white" : "bg-white text-sky-900 border border-sky-300"}`}>Polytrauma / Fractura</button>
                        <button type="button" onClick={() => applyDoctorTemplate("penetrating")} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${docTemplatePreset === "penetrating" ? "bg-sky-700 text-white" : "bg-white text-sky-900 border border-sky-300"}`}>Áthatoló laesio / Shock</button>
                        <button type="button" onClick={() => applyDoctorTemplate("loc")} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${docTemplatePreset === "loc" ? "bg-sky-700 text-white" : "bg-white text-sky-900 border border-sky-300"}`}>Syncope / Tudatzavar</button>
                      </div>
                    </div>
                    <div><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Beteg neve</label><input type="text" value={patientName} onChange={(e) => setPatientName(e.target.value)} className="inp bg-white text-xs" /></div>
                    <div><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Sérülés (szakszóval)</label><input type="text" value={injuryDesc} onChange={(e) => setInjuryDesc(e.target.value)} className="inp bg-white text-xs" /></div>
                    <div className="sm:col-span-2"><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Ellátás menete (szakszóval)</label><input type="text" value={careSteps} onChange={(e) => setCareSteps(e.target.value)} className="inp bg-white text-xs" /></div>
                    <div className="sm:col-span-2"><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Anamnézis és sérülési mechanizmus</label><input type="text" value={anamnesis} onChange={(e) => setAnamnesis(e.target.value)} className="inp bg-white text-xs" /></div>
                    <div><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Helyszíni vitális paraméterek</label><input type="text" value={vitalsScene} onChange={(e) => setVitalsScene(e.target.value)} className="inp bg-white text-xs" /></div>
                    <div><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Repülés alatti / átadáskori vitális értékek</label><input type="text" value={vitalsFlight} onChange={(e) => setVitalsFlight(e.target.value)} className="inp bg-white text-xs" /></div>
                    <div><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Alkalmazott gyógyszerek</label><input type="text" value={medsApplied} onChange={(e) => setMedsApplied(e.target.value)} className="inp bg-white text-xs" /></div>
                    <div><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Invazív beavatkozások</label><input type="text" value={interventions} onChange={(e) => setInterventions(e.target.value)} className="inp bg-white text-xs" /></div>
                    <div className="sm:col-span-2"><label className="block text-[11px] font-bold uppercase text-sky-900 mb-1">Kórházi átadás menete (SBAR)</label><input type="text" value={handoverNotes} onChange={(e) => setHandoverNotes(e.target.value)} className="inp bg-white text-xs" /></div>
                  </div>
                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-extrabold uppercase text-sky-800">Félig automatikusan kitöltött mentőorvosi jegyzőkönyv</span>
                      <button type="button" onClick={() => copyToClipboard(generatedDoctorReport, setCopiedDoc)} className={`inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-xs font-bold ${copiedDoc ? "bg-emerald-600 text-white" : "bg-sky-600 hover:bg-sky-700 text-white"}`}>{copiedDoc ? <Icons.Check c="w-3.5 h-3.5" /> : <Icons.Copy c="w-3.5 h-3.5" />}{copiedDoc ? "Orvosi jelentés kimásolva!" : "Orvosi jelentés másolása"}</button>
                    </div>
                    <pre className="p-3.5 rounded-xl bg-slate-900 text-sky-100 text-[11px] sm:text-xs font-mono whitespace-pre-wrap max-h-72 overflow-y-auto leading-relaxed">{generatedDoctorReport}</pre>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const SecretDevModal = ({ isOpen, onClose, devUnlocked, onUnlock, lzSpots, onSaveLzSpots }) => {
      const [uIn, setUIn] = useState("");
      const [pIn, setPIn] = useState("");
      const [err, setErr] = useState("");
      const [newSpot, setNewSpot] = useState({ name: "", x: 50, y: 50, route: "", reason: "", terrain: "", hazards: "" });

      if (!isOpen) return null;

      const handleUnlock = (e) => {
        e.preventDefault();
        if (uIn.trim() === DEV_SECRET_USER && pIn === DEV_SECRET_PASS) { onUnlock(); setErr(""); }
        else { setErr("Hibás fejlesztői azonosító vagy biztonsági kód!"); }
      };

      const addSpot = (e) => {
        e.preventDefault();
        if (!newSpot.name.trim()) return;
        const created = {
          id: "lz-" + Date.now(), name: newSpot.name.trim(),
          x: Math.max(2, Math.min(98, Number(newSpot.x) || 50)), y: Math.max(2, Math.min(98, Number(newSpot.y) || 50)),
          route: newSpot.route.trim() || `Pillbox Hill → ${newSpot.name.trim()} direkt légifolyosó, 1.500 ft AGL`,
          reason: newSpot.reason.trim() || "Kijelölt sürgősségi leszállóhely.",
          terrain: newSpot.terrain.trim() || "Sík, szilárd burkolatú leszállózóna.",
          hazards: newSpot.hazards.trim() || "Környező fák, oszlopok és oldalszél."
        };
        onSaveLzSpots([...lzSpots, created]);
        setNewSpot({ name: "", x: 50, y: 50, route: "", reason: "", terrain: "", hazards: "" });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 text-white border border-slate-700 rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="px-6 py-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className="p-2 rounded-lg bg-amber-500 text-slate-950"><Icons.Code c="w-5 h-5" /></span>
                <div>
                  <h3 className="text-base font-extrabold text-amber-400">OMSZ Developer Studio – Élő Tartalom- és Térképkezelő</h3>
                  <p className="text-xs text-slate-400">Közvetlen Supabase szerkesztés kódolás és Netlify újratöltés nélkül</p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 rounded-lg bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white"><Icons.X c="w-5 h-5" /></button>
            </div>

            <div className="p-6 overflow-y-auto space-y-6">
              {!devUnlocked ? (
                <form onSubmit={handleUnlock} className="max-w-md mx-auto space-y-4 py-4">
                  <div className="text-center space-y-1"><h4 className="text-lg font-bold">Fejlesztői hitelesítés</h4><p className="text-xs text-slate-400">Add meg a fejlesztői felhasználónevet és a mesterkódot.</p></div>
                  {err && <div className="p-3 rounded-lg bg-red-950/80 border border-red-700 text-xs text-red-300 font-semibold">{err}</div>}
                  <div><label className="block text-xs font-bold uppercase text-slate-400 mb-1">Fejlesztői felhasználónév</label><input type="text" value={uIn} onChange={(e) => setUIn(e.target.value)} placeholder="dev.omsz" className="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-amber-500" required /></div>
                  <div><label className="block text-xs font-bold uppercase text-slate-400 mb-1">Fejlesztői kód</label><input type="password" value={pIn} onChange={(e) => setPIn(e.target.value)} placeholder="••••••••" className="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-amber-500" required /></div>
                  <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-sm">Fejlesztői mód feloldása</button>
                </form>
              ) : (
                <div className="space-y-6">
                  <div className="p-4 rounded-xl bg-emerald-950/50 border border-emerald-700/60 text-xs text-emerald-200 flex items-center justify-between">
                    <span>✓ <strong>Fejlesztői mód aktív!</strong> Minden módosítás azonnal elmentődik a Supabase adatbázisba.</span>
                    <button onClick={() => onSaveLzSpots(INITIAL_HELI_LZ_SPOTS)} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-lg font-bold">Alap LZ-k visszaállítása</button>
                  </div>
                  <form onSubmit={addSpot} className="p-4 rounded-xl bg-slate-800/70 border border-slate-700 space-y-3">
                    <h4 className="text-sm font-extrabold text-amber-400">+ Új GTA V Helikopter Leszállózóna (LZ) hozzáadása</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                      <div className="sm:col-span-2"><label className="block text-[11px] text-slate-400 mb-1">Helyszín neve</label><input type="text" value={newSpot.name} onChange={(e) => setNewSpot({ ...newSpot, name: e.target.value })} placeholder="pl. Mirror Park Tópart" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs" required /></div>
                      <div><label className="block text-[11px] text-slate-400 mb-1">Térkép X % (0–100)</label><input type="number" step="0.1" value={newSpot.x} onChange={(e) => setNewSpot({ ...newSpot, x: e.target.value })} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs" required /></div>
                      <div><label className="block text-[11px] text-slate-400 mb-1">Térkép Y % (0–100)</label><input type="number" step="0.1" value={newSpot.y} onChange={(e) => setNewSpot({ ...newSpot, y: e.target.value })} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs" required /></div>
                      <div className="sm:col-span-2"><label className="block text-[11px] text-slate-400 mb-1">Légifolyosó / Útvonal</label><input type="text" value={newSpot.route} onChange={(e) => setNewSpot({ ...newSpot, route: e.target.value })} placeholder="Pillbox Hill → Mirror Park, 1.200 ft AGL" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs" /></div>
                      <div className="sm:col-span-2"><label className="block text-[11px] text-slate-400 mb-1">Szakmai indoklás</label><input type="text" value={newSpot.reason} onChange={(e) => setNewSpot({ ...newSpot, reason: e.target.value })} placeholder="Nyílt füves terület akadályok nélkül." className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs" /></div>
                      <div className="sm:col-span-2"><label className="block text-[11px] text-slate-400 mb-1">Terep- és talajviszonyok</label><input type="text" value={newSpot.terrain} onChange={(e) => setNewSpot({ ...newSpot, terrain: e.target.value })} placeholder="Tömörített füves talaj." className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs" /></div>
                      <div className="sm:col-span-2"><label className="block text-[11px] text-slate-400 mb-1">Veszélyforrások</label><input type="text" value={newSpot.hazards} onChange={(e) => setNewSpot({ ...newSpot, hazards: e.target.value })} placeholder="Közvilágítási oszlopok és fák." className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs" /></div>
                    </div>
                    <button type="submit" className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg">Leszállózóna mentése a térképre</button>
                  </form>
                  <div className="space-y-2">
                    <div className="text-xs font-bold uppercase text-slate-400">Aktív térképes leszállózónák ({lzSpots.length} db)</div>
                    <div className="max-h-56 overflow-y-auto space-y-1.5 pr-1">
                      {lzSpots.map((s) => (
                        <div key={s.id} className="flex items-center justify-between px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs">
                          <div><span className="font-bold text-white">{s.name}</span> <span className="text-slate-400 font-mono ml-2">[X:{s.x}% Y:{s.y}%]</span></div>
                          <button onClick={() => onSaveLzSpots(lzSpots.filter((x) => x.id !== s.id))} className="text-red-400 hover:text-red-300 p-1"><Icons.Trash c="w-4 h-4" /></button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const DocumentViewer = ({ docData, onUpdateDoc, canEdit }) => {
      const [search, setSearch] = useState("");
      const [medSearch, setMedSearch] = useState("");
      const [openCh, setOpenCh] = useState(() => Object.fromEntries(docData.chapters.map((c) => [c.id, true])));
      const [editMode, setEditMode] = useState(false);
      const [edChId, setEdChId] = useState(null);
      const [chTitle, setChTitle] = useState("");
      const [chDesc, setChDesc] = useState("");
      const [newItemIn, setNewItemIn] = useState({});
      const [edItem, setEdItem] = useState(null);
      const [newCh, setNewCh] = useState({ t: "", d: "", show: false });
      const [newMed, setNewMed] = useState({ name: "", effect: "", form: "" });

      useEffect(() => { if (!canEdit) setEditMode(false); }, [canEdit]);
      useEffect(() => { setOpenCh(Object.fromEntries(docData.chapters.map((c) => [c.id, true]))); setSearch(""); setEditMode(false); }, [docData.title]);

      const q = search.trim().toLowerCase();
      const filtered = useMemo(() => {
        if (!q) return docData.chapters;
        return docData.chapters.map((ch) => {
          const tm = ch.title.toLowerCase().includes(q), dm = (ch.description || "").toLowerCase().includes(q);
          const mi = (ch.items || []).filter((it) => it.toLowerCase().includes(q));
          const mm = (ch.medications || []).filter((m) => m.name.toLowerCase().includes(q) || m.effect.toLowerCase().includes(q) || m.form.toLowerCase().includes(q));
          const mv = (ch.vitals || []).filter((v) => v.label.toLowerCase().includes(q) || v.range.toLowerCase().includes(q));
          if (tm || dm || mi.length || mm.length || mv.length) return { ...ch, items: tm || dm ? ch.items : mi, medications: tm || dm ? ch.medications : mm, vitals: tm || dm ? ch.vitals : mv };
          return null;
        }).filter(Boolean);
      }, [docData.chapters, q]);

      const scrollToCh = (id) => {
        setOpenCh((p) => ({ ...p, [id]: true }));
        setTimeout(() => document.getElementById(`chapter-${id}`)?.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
      };

      const renderText = (txt) => {
        const idx = txt.indexOf(":");
        if (idx > 0 && idx < 56) return <span><strong className="font-semibold text-slate-900">{txt.slice(0, idx + 1)}</strong>{txt.slice(idx + 1)}</span>;
        return txt;
      };

      return (
        <div className="space-y-6">
          <div className="card p-5 md:p-6">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div>
                <div className="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold mb-2">
                  <span className="w-2 h-2 rounded-full bg-amber-500"></span>{docData.metadata}
                </div>
                <h2 className="text-xl md:text-2xl font-extrabold text-slate-900">{docData.title}</h2>
              </div>
              {canEdit && (
                <button onClick={() => setEditMode(!editMode)} className={`inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm ${editMode ? "bg-amber-500 text-slate-950" : "bg-red-600 text-white hover:bg-red-700"}`}>
                  <Icons.Edit c="w-4 h-4" />{editMode ? "Szerkesztés befejezése" : "Szerkesztés"}
                </button>
              )}
            </div>
            <div className="mt-5 pt-5 border-t border-slate-100 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
              <div className="relative flex-1 max-w-xl">
                <Icons.Search c="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Keresés a dokumentumban (pl. rádió, gyógyszer, AFK, Lidocain)..." className="inp pl-10 pr-9 py-2.5" />
                {search && <button onClick={() => setSearch("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700"><Icons.X c="w-4 h-4" /></button>}
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setOpenCh(Object.fromEntries(docData.chapters.map((c) => [c.id, true])))} className="px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg">Összes kinyitása</button>
                <button onClick={() => setOpenCh(Object.fromEntries(docData.chapters.map((c) => [c.id, false])))} className="px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg">Összes becsukása</button>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
            <aside className="xl:col-span-4 xl:sticky xl:top-20 card p-4">
              <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-800">Tartalomjegyzék</h3>
                <span className="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">{docData.chapters.length} fejezet</span>
              </div>
              <nav className="space-y-1 max-h-[65vh] overflow-y-auto pr-1">
                {docData.chapters.map((ch) => (
                  <button key={ch.id} onClick={() => scrollToCh(ch.id)} className="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 hover:text-red-600 flex items-center justify-between group">
                    <span className="truncate pr-2">{ch.title}</span><Icons.Right c="w-4 h-4 text-slate-300 group-hover:text-red-500 shrink-0" />
                  </button>
                ))}
              </nav>
              {editMode && (
                <div className="mt-4 pt-3 border-t border-slate-100">
                  {!newCh.show ? (
                    <button onClick={() => setNewCh({ ...newCh, show: true })} className="w-full inline-flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-slate-900 text-white text-xs font-semibold"><Icons.Plus c="w-4 h-4" />Új fejezet hozzáadása</button>
                  ) : (
                    <form onSubmit={(e) => {
                      e.preventDefault(); if (!newCh.t.trim()) return;
                      const created = { id: "ch-" + Date.now(), title: newCh.t.trim(), description: newCh.d.trim(), items: [] };
                      onUpdateDoc({ ...docData, chapters: [...docData.chapters, created] });
                      setOpenCh((p) => ({ ...p, [created.id]: true })); setNewCh({ t: "", d: "", show: false });
                    }} className="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                      <input type="text" placeholder="Új fejezet címe..." value={newCh.t} onChange={(e) => setNewCh({ ...newCh, t: e.target.value })} className="inp text-xs py-1.5" required />
                      <input type="text" placeholder="Rövid leírás..." value={newCh.d} onChange={(e) => setNewCh({ ...newCh, d: e.target.value })} className="inp text-xs py-1.5" />
                      <div className="flex gap-2"><button type="submit" className="flex-1 py-1.5 bg-red-600 text-white text-xs font-semibold rounded">Mentés</button><button type="button" onClick={() => setNewCh({ ...newCh, show: false })} className="px-3 py-1.5 bg-slate-200 text-xs font-semibold rounded">Mégse</button></div>
                    </form>
                  )}
                </div>
              )}
            </aside>

            <div className="xl:col-span-8 space-y-4">
              {filtered.length === 0 ? (
                <div className="card p-10 text-center"><Icons.Search c="w-10 h-10 text-slate-300 mx-auto mb-3" /><h4 className="font-bold">Nincs találat</h4></div>
              ) : filtered.map((ch) => {
                const isOpen = !!openCh[ch.id] || !!q;
                return (
                  <div key={ch.id} id={`chapter-${ch.id}`} className="card overflow-hidden scroll-mt-24">
                    <div className="px-5 py-4 bg-slate-50/70 border-b border-slate-100 flex items-center justify-between gap-3">
                      {edChId === ch.id ? (
                        <div className="flex-1 space-y-2">
                          <input type="text" value={chTitle} onChange={(e) => setChTitle(e.target.value)} className="inp font-bold" />
                          <input type="text" value={chDesc} onChange={(e) => setChDesc(e.target.value)} placeholder="Leírás..." className="inp text-xs" />
                          <div className="flex gap-2">
                            <button onClick={() => { if (chTitle.trim()) { onUpdateDoc({ ...docData, chapters: docData.chapters.map((c) => c.id === ch.id ? { ...c, title: chTitle.trim(), description: chDesc.trim() } : c) }); setEdChId(null); } }} className="px-3 py-1 bg-emerald-600 text-white text-xs font-semibold rounded">Mentés</button>
                            <button onClick={() => setEdChId(null)} className="px-3 py-1 bg-slate-200 text-xs font-semibold rounded">Mégse</button>
                          </div>
                        </div>
                      ) : (
                        <button onClick={() => setOpenCh((p) => ({ ...p, [ch.id]: !p[ch.id] }))} className="flex-1 text-left flex items-center gap-3 group">
                          <span className="p-1.5 rounded-lg bg-slate-900 text-white group-hover:bg-red-600">{isOpen ? <Icons.Down c="w-4 h-4" /> : <Icons.Right c="w-4 h-4" />}</span>
                          <h3 className="text-base md:text-lg font-bold text-slate-900 group-hover:text-red-700">{ch.title}</h3>
                        </button>
                      )}
                      {editMode && edChId !== ch.id && (
                        <div className="flex items-center gap-1 shrink-0">
                          <button onClick={() => { setEdChId(ch.id); setChTitle(ch.title); setChDesc(ch.description || ""); }} className="p-1.5 text-slate-500 hover:text-indigo-600"><Icons.Edit c="w-4 h-4" /></button>
                          <button onClick={() => { if (window.confirm("Törlöd ezt a fejezetet?")) onUpdateDoc({ ...docData, chapters: docData.chapters.filter((c) => c.id !== ch.id) }); }} className="p-1.5 text-slate-500 hover:text-red-600"><Icons.Trash c="w-4 h-4" /></button>
                        </div>
                      )}
                    </div>

                    {isOpen && (
                      <div className="p-5 space-y-4">
                        {ch.description && <p className="text-sm text-slate-600 bg-slate-50 border-l-4 border-amber-500 px-3.5 py-2.5 rounded-r-lg">{ch.description}</p>}

                        {ch.type === "medications" && ch.medications && (
                          <div className="space-y-3">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                              <div className="inline-flex items-center gap-2 text-xs font-bold uppercase text-slate-500"><Icons.Pill c="w-4 h-4 text-red-600" />Kereshető gyógyszertár ({ch.medications.length})</div>
                              <input type="text" value={medSearch} onChange={(e) => setMedSearch(e.target.value)} placeholder="Gyógyszer szűrése..." className="inp sm:w-56 text-xs py-1.5" />
                            </div>
                            <div className="overflow-x-auto rounded-lg border border-slate-200">
                              <table className="w-full text-left border-collapse">
                                <thead><tr className="bg-slate-900 text-white text-xs uppercase"><th className="py-2.5 px-4">Gyógyszer</th><th className="py-2.5 px-4">Hatás / Indikáció</th><th className="py-2.5 px-4">Forma</th>{editMode && <th className="py-2.5 px-3 text-right">Művelet</th>}</tr></thead>
                                <tbody className="divide-y divide-slate-200 text-sm">
                                  {ch.medications.filter((m) => { const mq = medSearch.trim().toLowerCase(); return !mq || m.name.toLowerCase().includes(mq) || m.effect.toLowerCase().includes(mq) || m.form.toLowerCase().includes(mq); }).map((med) => (
                                    <tr key={med.id} className="hover:bg-slate-50">
                                      <td className="py-2.5 px-4 font-bold">{med.name}</td>
                                      <td className="py-2.5 px-4 text-slate-700">{med.effect}</td>
                                      <td className="py-2.5 px-4"><span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-900">{med.form}</span></td>
                                      {editMode && <td className="py-2.5 px-3 text-right"><button onClick={() => onUpdateDoc({ ...docData, chapters: docData.chapters.map((c) => c.id === ch.id ? { ...c, medications: c.medications.filter((x) => x.id !== med.id) } : c) })} className="text-red-500 p-1"><Icons.Trash c="w-4 h-4" /></button></td>}
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                            {editMode && (
                              <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 pt-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <input type="text" placeholder="Gyógyszer" value={newMed.name} onChange={(e) => setNewMed({ ...newMed, name: e.target.value })} className="inp text-xs py-1.5" />
                                <input type="text" placeholder="Hatás" value={newMed.effect} onChange={(e) => setNewMed({ ...newMed, effect: e.target.value })} className="inp text-xs py-1.5" />
                                <input type="text" placeholder="Forma" value={newMed.form} onChange={(e) => setNewMed({ ...newMed, form: e.target.value })} className="inp text-xs py-1.5" />
                                <button onClick={() => { if (!newMed.name.trim() || !newMed.effect.trim()) return; onUpdateDoc({ ...docData, chapters: docData.chapters.map((c) => c.id === ch.id ? { ...c, medications: [...c.medications, { id: "m-" + Date.now(), name: newMed.name.trim(), effect: newMed.effect.trim(), form: newMed.form.trim() || "i.v." }] } : c) }); setNewMed({ name: "", effect: "", form: "" }); }} className="px-3 py-1.5 bg-red-600 text-white text-xs font-semibold rounded">+ Hozzáadás</button>
                              </div>
                            )}
                          </div>
                        )}

                        {ch.type === "vitals" && ch.vitals && (
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                            {ch.vitals.map((v) => (
                              <div key={v.id} className="p-4 rounded-xl bg-gradient-to-br from-slate-900 to-slate-800 text-white shadow-sm">
                                <div className="flex items-center justify-between mb-1.5"><span className="text-xs font-bold uppercase text-amber-400">{v.label}</span><Icons.Heart c="w-4 h-4 text-red-400" /></div>
                                <div className="text-xl font-extrabold">{v.range}</div>
                                <div className="text-xs text-slate-300 mt-1">{v.note}</div>
                              </div>
                            ))}
                          </div>
                        )}

                        {(ch.items || []).length > 0 && (
                          <ul className="space-y-2.5">
                            {ch.items.map((item, idx) => {
                              const isEd = edItem && edItem.chId === ch.id && edItem.idx === idx;
                              return (
                                <li key={idx} className="flex items-start gap-3 p-3 rounded-lg bg-slate-50/70 border border-slate-100 text-sm text-slate-700 leading-relaxed">
                                  <span className="w-6 h-6 rounded-full bg-red-50 border border-red-200 text-red-700 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">{idx + 1}</span>
                                  {isEd ? (
                                    <div className="flex-1 space-y-2">
                                      <textarea rows="3" value={edItem.text} onChange={(e) => setEdItem({ ...edItem, text: e.target.value })} className="inp" />
                                      <div className="flex gap-2">
                                        <button onClick={() => { if (!edItem.text.trim()) return; onUpdateDoc({ ...docData, chapters: docData.chapters.map((c) => c.id === ch.id ? { ...c, items: c.items.map((x, i) => i === idx ? edItem.text.trim() : x) } : c) }); setEdItem(null); }} className="px-3 py-1 bg-emerald-600 text-white text-xs font-semibold rounded">Mentés</button>
                                        <button onClick={() => setEdItem(null)} className="px-3 py-1 bg-slate-200 text-xs font-semibold rounded">Mégse</button>
                                      </div>
                                    </div>
                                  ) : <div className="flex-1">{renderText(item)}</div>}
                                  {editMode && !isEd && (
                                    <div className="flex gap-1 shrink-0">
                                      <button onClick={() => setEdItem({ chId: ch.id, idx, text: item })} className="p-1 text-slate-400 hover:text-indigo-600"><Icons.Edit c="w-4 h-4" /></button>
                                      <button onClick={() => onUpdateDoc({ ...docData, chapters: docData.chapters.map((c) => c.id === ch.id ? { ...c, items: c.items.filter((_, i) => i !== idx) } : c) })} className="p-1 text-slate-400 hover:text-red-600"><Icons.Trash c="w-4 h-4" /></button>
                                    </div>
                                  )}
                                </li>
                              );
                            })}
                          </ul>
                        )}

                        {editMode && ch.type !== "medications" && ch.type !== "vitals" && (
                          <div className="pt-2 flex flex-col sm:flex-row gap-2">
                            <input type="text" value={newItemIn[ch.id] || ""} onChange={(e) => setNewItemIn((p) => ({ ...p, [ch.id]: e.target.value }))} placeholder="Új pont hozzáadása..." className="inp flex-1" />
                            <button onClick={() => { const v = (newItemIn[ch.id] || "").trim(); if (!v) return; onUpdateDoc({ ...docData, chapters: docData.chapters.map((c) => c.id === ch.id ? { ...c, items: [...(c.items || []), v] } : c) }); setNewItemIn((p) => ({ ...p, [ch.id]: "" })); }} className="inline-flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-900 text-white text-sm font-semibold rounded-lg"><Icons.Plus c="w-4 h-4" />Hozzáadás</button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    const SubDepartmentView = ({ deptData, currentUser, lzSpots, onUpdateDept, onOpenExam }) => {
      const role = currentUser.role;
      const hasInternal = canAccessSubDeptInternal(role, deptData.id);
      const canEdit = canEditSubDept(role);

      const [edPub, setEdPub] = useState(false);
      const [pubTxt, setPubTxt] = useState(deptData.publicAnnouncement || "");
      const [edInt, setEdInt] = useState(false);
      const [intTxt, setIntTxt] = useState(deptData.internalAnnouncement || "");
      const [edRep, setEdRep] = useState(false);
      const [repTxt, setRepTxt] = useState(deptData.reportTemplate || "");
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        setPubTxt(deptData.publicAnnouncement || ""); setIntTxt(deptData.internalAnnouncement || ""); setRepTxt(deptData.reportTemplate || "");
        setEdPub(false); setEdInt(false); setEdRep(false);
      }, [deptData.id, deptData.publicAnnouncement, deptData.internalAnnouncement, deptData.reportTemplate]);

      const copyTpl = () => {
        const t = deptData.reportTemplate || "";
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
        else { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); setCopied(true); setTimeout(() => setCopied(false), 2000); }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border-2 border-amber-300 shadow-sm overflow-hidden">
            <div className="px-5 py-3.5 bg-amber-50 border-b border-amber-200 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <span className="p-1.5 rounded-lg bg-amber-500 text-slate-950"><Icons.Mega c="w-4 h-4" /></span>
                <div>
                  <h3 className="text-sm font-extrabold uppercase tracking-wider text-amber-950">{deptData.name} – Nyilvános / Jelentkezési Felhívás</h3>
                  <p className="text-[11px] text-amber-800">Külsős felvételi kiírás és jelentkezési feltételek a Mentősök számára</p>
                </div>
              </div>
              {canEdit && !edPub && <button onClick={() => setEdPub(true)} className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 text-white text-xs font-bold rounded-lg"><Icons.Edit c="w-3.5 h-3.5" />Felhívás szerkesztése</button>}
            </div>
            <div className="p-5">
              {edPub ? (
                <div className="space-y-3">
                  <textarea rows="6" value={pubTxt} onChange={(e) => setPubTxt(e.target.value)} className="inp" />
                  <div className="flex justify-end gap-2">
                    <button onClick={() => { setPubTxt(deptData.publicAnnouncement || ""); setEdPub(false); }} className="px-4 py-2 bg-slate-200 text-xs font-bold rounded-lg">Mégse</button>
                    <button onClick={() => { onUpdateDept({ ...deptData, publicAnnouncement: pubTxt }); setEdPub(false); }} className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg">Mentés Supabase-be</button>
                  </div>
                </div>
              ) : <div className="text-sm text-slate-700 whitespace-pre-line leading-relaxed">{deptData.publicAnnouncement || "Nincs kiírt jelentkezési felhívás."}</div>}
            </div>
          </div>

          {!hasInternal ? (
            <div className="bg-slate-900 text-white rounded-2xl p-8 text-center space-y-3 border border-slate-800">
              <div className="w-14 h-14 rounded-2xl bg-red-600/20 border border-red-500/40 text-red-400 flex items-center justify-center mx-auto"><Icons.Lock c="w-7 h-7" /></div>
              <h3 className="text-xl font-extrabold">Belső alosztályi anyagok zárolva</h3>
              <p className="text-sm text-slate-300 max-w-xl mx-auto">A(z) <strong>{deptData.name}</strong> belső szabályzata, tananyaga, jelentésmintája és belső felhívásai kizárólag az alosztály tagjai, az Alosztályvezető és a Vezetőség számára érhetők el.</p>
            </div>
          ) : (
            <>
              <div className="bg-slate-900 text-white rounded-2xl border border-slate-800 overflow-hidden">
                <div className="px-5 py-3.5 bg-slate-800/80 border-b border-slate-700 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2.5">
                    <span className="p-1.5 rounded-lg bg-red-600 text-white"><Icons.Alert c="w-4 h-4" /></span>
                    <div>
                      <h3 className="text-sm font-extrabold uppercase tracking-wider text-amber-400">Belső Alosztályi Felhívás & Eligazítások</h3>
                      <p className="text-[11px] text-slate-300">Kizárólag a {deptData.shortName} alosztály tagjainak és a vezetőknek látható</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    {canEdit && !edInt && <button onClick={() => setEdInt(true)} className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg"><Icons.Edit c="w-3.5 h-3.5" />Belső felhívás szerkesztése</button>}
                    <button onClick={onOpenExam} className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-600 text-white text-xs font-bold rounded-lg"><Icons.Clip c="w-3.5 h-3.5" />Alosztályi vizsga</button>
                  </div>
                </div>
                <div className="p-5">
                  {edInt ? (
                    <div className="space-y-3">
                      <textarea rows="4" value={intTxt} onChange={(e) => setIntTxt(e.target.value)} className="w-full p-3 text-sm bg-slate-800 text-white border border-slate-600 rounded-xl" />
                      <div className="flex justify-end gap-2">
                        <button onClick={() => { setIntTxt(deptData.internalAnnouncement || ""); setEdInt(false); }} className="px-4 py-2 bg-slate-700 text-slate-200 text-xs font-bold rounded-lg">Mégse</button>
                        <button onClick={() => { onUpdateDept({ ...deptData, internalAnnouncement: intTxt }); setEdInt(false); }} className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg">Mentés Supabase-be</button>
                      </div>
                    </div>
                  ) : <div className="text-sm text-slate-200 whitespace-pre-line leading-relaxed">{deptData.internalAnnouncement || "Nincs aktív belső felhívás."}</div>}
                </div>
              </div>

              {deptData.id === "helikopteres" && <HeliMapReportGenerator currentUser={currentUser} lzSpots={lzSpots} />}

              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div className="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2.5">
                    <span className="p-1.5 rounded-lg bg-slate-900 text-white"><Icons.File c="w-4 h-4" /></span>
                    <div>
                      <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-900">Jelentés minta ({deptData.shortName})</h3>
                      <p className="text-[11px] text-slate-500">Szabványos RP szolgálati jelentéssablon másoláshoz</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={copyTpl} className={`inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold ${copied ? "bg-emerald-600 text-white" : "bg-slate-900 text-white"}`}>
                      {copied ? <Icons.Check c="w-3.5 h-3.5" /> : <Icons.Copy c="w-3.5 h-3.5" />}{copied ? "Sablon kimásolva!" : "Sablon másolása"}
                    </button>
                    {canEdit && !edRep && <button onClick={() => setEdRep(true)} className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-600 text-white text-xs font-bold rounded-lg"><Icons.Edit c="w-3.5 h-3.5" />Sablon szerkesztése</button>}
                  </div>
                </div>
                <div className="p-5">
                  {edRep ? (
                    <div className="space-y-3">
                      <textarea rows="7" value={repTxt} onChange={(e) => setRepTxt(e.target.value)} className="inp font-mono" />
                      <div className="flex justify-end gap-2">
                        <button onClick={() => { setRepTxt(deptData.reportTemplate || ""); setEdRep(false); }} className="px-4 py-2 bg-slate-200 text-xs font-bold rounded-lg">Mégse</button>
                        <button onClick={() => { onUpdateDept({ ...deptData, reportTemplate: repTxt }); setEdRep(false); }} className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg">Sablon mentése Supabase-be</button>
                      </div>
                    </div>
                  ) : <pre className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-mono text-slate-800 whitespace-pre-wrap">{deptData.reportTemplate}</pre>}
                </div>
              </div>

              <DocumentViewer docData={deptData} onUpdateDoc={onUpdateDept} canEdit={canEdit} />
            </>
          )}
        </div>
      );
    };

    const ExamSystem = ({ currentUser, users, questionsByCat, onSaveQuestion, onDeleteQuestion, examResults, onAddResult, onDeleteResult, onConsumeExamPermission, onUpdateUserField, missingColsAlert, initialSubTab = "practice" }) => {
      const role = currentUser.role;
      const myLiveUser = users.find((u) => u.id === currentUser.id) || currentUser;

      const availCats = useMemo(() => {
        const l = [
          { id: "altalanos_ooc", label: "Általános OOC vizsga (Általános Szabályzat)", drawCount: 15 },
          { id: "altalanos_ic", label: "Általános IC vizsga (Oktatási Kézikönyv / Tananyag)", drawCount: 15 },
        ];
        if (canAccessSubDeptInternal(role, "motoros")) l.push({ id: "motoros", label: "Mentőmotoros alosztályi vizsga", drawCount: 10 });
        if (canAccessSubDeptInternal(role, "helikopteres")) l.push({ id: "helikopteres", label: "Mentőhelikopteres alosztályi vizsga", drawCount: 10 });
        return l;
      }, [role]);

      const [subTab, setSubTab] = useState(initialSubTab);
      const [selCat, setSelCat] = useState("altalanos_ooc");
      const [viewingResult, setViewingResult] = useState(null);

      useEffect(() => {
        if (!availCats.some((c) => c.id === selCat)) setSelCat("altalanos_ooc");
        if ((subTab === "editor" || subTab === "permissions") && role !== "alosztalyvezeto" && role !== "vezetoseg") setSubTab("practice");
        if (subTab === "results" && !canViewResults(role)) setSubTab("practice");
      }, [role, availCats, selCat, subTab]);

      const [pActive, setPActive] = useState(false);
      const [pQs, setPQs] = useState([]);
      const [pIdx, setPIdx] = useState(0);
      const [pOpt, setPOpt] = useState(null);
      const [pScore, setPScore] = useState(0);
      const [pDone, setPDone] = useState(false);
      const [pTimeLeft, setPTimeLeft] = useState(QUESTION_SEC_LIMIT);

      const pool = questionsByCat[selCat] || [];
      const catMeta = availCats.find((c) => c.id === selCat) || availCats[0];
      const drawLimit = catMeta ? catMeta.drawCount : 15;

      const startPractice = () => {
        if (!pool.length) return;
        setPQs(buildRandomExam(pool, drawLimit));
        setPActive(true); setPIdx(0); setPOpt(null); setPScore(0); setPDone(false); setPTimeLeft(QUESTION_SEC_LIMIT);
      };

      const nextPracticeQuestion = useCallback(() => {
        if (pIdx + 1 < pQs.length) {
          setPIdx((i) => i + 1);
          setPOpt(null);
          setPTimeLeft(QUESTION_SEC_LIMIT);
        } else {
          setPDone(true);
        }
      }, [pIdx, pQs.length]);

      useEffect(() => {
        if (!pActive || pDone || pOpt !== null) return;
        if (pTimeLeft <= 0) {
          nextPracticeQuestion();
          return;
        }
        const t = setInterval(() => setPTimeLeft((s) => s - 1), 1000);
        return () => clearInterval(t);
      }, [pActive, pDone, pOpt, pTimeLeft, nextPracticeQuestion]);

      const [oActive, setOActive] = useState(false);
      const [oQs, setOQs] = useState([]);
      const [oAns, setOAns] = useState({});
      const [oIdx, setOIdx] = useState(0);
      const [oTimeLeft, setOTimeLeft] = useState(QUESTION_SEC_LIMIT);
      const [oStartedAt, setOStartedAt] = useState(0);
      const [oRep, setORep] = useState(null);

      const hasPerm = selCat === "altalanos_ooc"
        ? Boolean(myLiveUser.canTakeOocExam)
        : selCat === "altalanos_ic"
          ? Boolean(myLiveUser.canTakeIcExam)
          : Boolean(myLiveUser.canTakeSubdeptExam);

      const startOfficial = () => {
        if (!pool.length || !hasPerm) return;
        const rand = buildRandomExam(pool, drawLimit);
        setOQs(rand); setOAns({}); setOIdx(0); setOTimeLeft(QUESTION_SEC_LIMIT); setOStartedAt(Date.now()); setORep(null); setOActive(true);
      };

      const submitOfficial = useCallback(async (finalAnsObj = oAns) => {
        let corr = 0;
        const details = oQs.map((q, idx) => {
          const sel = finalAnsObj[idx] !== undefined ? finalAnsObj[idx] : null;
          const ok = sel === q.correctIndex;
          if (ok) corr++;
          return { question: q.question, options: q.options, selectedIndex: sel, correctIndex: q.correctIndex, explanation: q.explanation || "", isCorrect: ok };
        });
        const pct = oQs.length ? Math.round((corr / oQs.length) * 100) : 0;
        const now = new Date();
        const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, "0")}.${String(now.getDate()).padStart(2, "0")}. ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
        const elapsedSec = oStartedAt ? Math.max(1, Math.round((Date.now() - oStartedAt) / 1000)) : oQs.length * QUESTION_SEC_LIMIT;
        const rec = {
          id: "res-" + Date.now(), date: dateStr, userId: myLiveUser.id, userName: myLiveUser.name,
          roleLabel: ROLES[myLiveUser.role].label, categoryLabel: catMeta ? catMeta.label : selCat,
          score: corr, total: oQs.length, percentage: pct, passed: pct >= 80, durationSec: elapsedSec, details
        };
        await onAddResult(rec);
        await onConsumeExamPermission(myLiveUser.id, selCat);
        setOActive(false); setORep({ ...rec, questions: oQs, answers: finalAnsObj });
      }, [oAns, oQs, oStartedAt, myLiveUser, catMeta, selCat, onAddResult, onConsumeExamPermission]);

      const advanceOfficialQuestion = useCallback(() => {
        if (oIdx + 1 < oQs.length) {
          setOIdx((i) => i + 1);
          setOTimeLeft(QUESTION_SEC_LIMIT);
        } else {
          submitOfficial(oAns);
        }
      }, [oIdx, oQs.length, oAns, submitOfficial]);

      useEffect(() => {
        if (!oActive) return;
        if (oTimeLeft <= 0) {
          advanceOfficialQuestion();
          return;
        }
        const t = setInterval(() => setOTimeLeft((s) => s - 1), 1000);
        return () => clearInterval(t);
      }, [oActive, oTimeLeft, advanceOfficialQuestion]);

      const [edCat, setEdCat] = useState(role === "alosztalyvezeto" ? "motoros" : "altalanos_ooc");
      const [qForm, setQForm] = useState({ id: null, question: "", options: ["", "", "", ""], correctIndex: 0, explanation: "" });
      const [showQForm, setShowQForm] = useState(false);

      useEffect(() => {
        if (role === "alosztalyvezeto" && (edCat === "altalanos_ooc" || edCat === "altalanos_ic")) setEdCat("motoros");
      }, [role, edCat]);

      return (
        <div className="space-y-6">
          {missingColsAlert && (role === "vezetoseg" || role === "alosztalyvezeto") && (
            <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 text-xs text-amber-950 space-y-1.5">
              <div className="font-bold flex items-center gap-2"><Icons.Alert c="w-4 h-4 text-amber-600" />Hiányzó Supabase oszlopok észlelve</div>
              <code className="block bg-white border border-amber-200 px-3 py-2 rounded font-mono text-[11px] select-all whitespace-pre-wrap">
{`ALTER TABLE public.omsz_users ADD COLUMN IF NOT EXISTS total_duty_minutes INTEGER NOT NULL DEFAULT 0;
ALTER TABLE public.omsz_users ADD COLUMN IF NOT EXISTS can_take_general_exam BOOLEAN NOT NULL DEFAULT FALSE;
ALTER TABLE public.omsz_users ADD COLUMN IF NOT EXISTS can_take_subdept_exam BOOLEAN NOT NULL DEFAULT FALSE;
ALTER TABLE public.omsz_exam_results ADD COLUMN IF NOT EXISTS details JSONB;`}
              </code>
            </div>
          )}

          <div className="card p-5">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="text-xl md:text-2xl font-extrabold text-slate-900">Interaktív Vizsgarendszer (OOC & IC)</h2>
                <p className="text-sm text-slate-500 mt-0.5">Külön OOC (Szabályzat) és IC (Tananyag) vizsgák • Minden kérdésre <strong>30 másodperc</strong> áll rendelkezésre (80%-os ponthatár).</p>
              </div>
              <div className="flex flex-wrap gap-2">
                <button onClick={() => { setSubTab("practice"); setOActive(false); }} className={`px-4 py-2 rounded-lg text-sm font-semibold ${subTab === "practice" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700"}`}>Gyakorló vizsga</button>
                <button onClick={() => { setSubTab("official"); setPActive(false); }} className={`px-4 py-2 rounded-lg text-sm font-semibold ${subTab === "official" ? "bg-red-600 text-white" : "bg-slate-100 text-slate-700"}`}>Éles vizsga</button>
                {(role === "alosztalyvezeto" || role === "vezetoseg") && (
                  <>
                    <button onClick={() => { setSubTab("permissions"); setOActive(false); setPActive(false); }} className={`px-4 py-2 rounded-lg text-sm font-semibold ${subTab === "permissions" ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-700"}`}>Vizsgaengedélyek</button>
                    <button onClick={() => { setSubTab("editor"); setOActive(false); setPActive(false); }} className={`px-4 py-2 rounded-lg text-sm font-semibold ${subTab === "editor" ? "bg-amber-500 text-slate-950" : "bg-slate-100 text-slate-700"}`}>Kérdés szerkesztő</button>
                  </>
                )}
                {canViewResults(role) && <button onClick={() => { setSubTab("results"); setOActive(false); setPActive(false); }} className={`px-4 py-2 rounded-lg text-sm font-semibold ${subTab === "results" ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-700"}`}>Eredmények ({examResults.length})</button>}
              </div>
            </div>
          </div>

          {subTab === "practice" && (
            <div className="card p-6">
              {!pActive ? (
                <div className="max-w-2xl mx-auto text-center space-y-5 py-4">
                  <div className="w-14 h-14 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center mx-auto"><Icons.Book c="w-7 h-7" /></div>
                  <div><h3 className="text-xl font-bold">Gyakorló vizsga indítása</h3><p className="text-sm text-slate-600 mt-1">Válassz az <strong>OOC (Szabályzat)</strong>, az <strong>IC (Tananyag)</strong> vagy az alosztályi kérdéssorok közül. Minden kérdésre <strong>30 másodperc</strong> van, az eredmény nem kerül naplózásra.</p></div>
                  <div className="text-left bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-2">Válassz vizsgakategóriát</label>
                    <select value={selCat} onChange={(e) => setSelCat(e.target.value)} className="inp font-semibold">{availCats.map((c) => <option key={c.id} value={c.id}>{c.label} ({(questionsByCat[c.id] || []).length} kérdésből {Math.min(c.drawCount, (questionsByCat[c.id] || []).length)} db)</option>)}</select>
                  </div>
                  <button onClick={startPractice} disabled={!pool.length} className="px-6 py-3 bg-slate-900 text-white font-bold rounded-xl">Gyakorlás indítása ({Math.min(drawLimit, pool.length)} kérdés • 30 mp / kérdés)</button>
                </div>
              ) : pDone ? (
                <div className="max-w-xl mx-auto text-center space-y-5 py-6">
                  <div className="w-16 h-16 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto"><Icons.Award c="w-8 h-8" /></div>
                  <h3 className="text-2xl font-extrabold">Gyakorlás befejezve!</h3>
                  <div className="p-5 bg-slate-50 rounded-xl border border-slate-200"><div className="text-3xl font-extrabold">{pScore} / {pQs.length} ({Math.round((pScore / pQs.length) * 100)}%)</div><p className="text-xs text-slate-500 mt-1">Gyakorló mód – nem került naplózásra.</p></div>
                  <div className="flex justify-center gap-3"><button onClick={startPractice} className="px-5 py-2.5 bg-slate-900 text-white text-sm font-semibold rounded-lg">Új véletlen teszt</button><button onClick={() => setPActive(false)} className="px-5 py-2.5 bg-slate-200 text-sm font-semibold rounded-lg">Vissza</button></div>
                </div>
              ) : (
                <div className="max-w-3xl mx-auto space-y-5">
                  <div className="flex flex-wrap items-center justify-between gap-2 p-3.5 rounded-xl bg-slate-900 text-white">
                    <div className="text-xs font-bold uppercase"><span>Kérdés {pIdx + 1} / {pQs.length}</span> <span className="text-slate-400 ml-2">• Helyes: {pScore}</span></div>
                    <div className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-lg font-mono text-sm font-extrabold ${pTimeLeft <= 8 && pOpt === null ? "bg-red-600 animate-pulse" : "bg-slate-800 text-amber-400"}`}><Icons.Clock c="w-4 h-4" />{pTimeLeft} mp</div>
                  </div>
                  <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-red-600 transition-all" style={{ width: `${((pIdx + 1) / pQs.length) * 100}%` }} /></div>
                  <h3 className="text-lg md:text-xl font-bold pt-2">{pQs[pIdx].question}</h3>
                  <div className="space-y-2.5">
                    {pQs[pIdx].options.map((opt, idx) => {
                      const ans = pOpt !== null, ok = idx === pQs[pIdx].correctIndex, sel = idx === pOpt;
                      let st = "bg-white border-slate-200 hover:border-slate-400";
                      if (ans) st = ok ? "bg-emerald-50 border-emerald-500 text-emerald-900" : sel ? "bg-red-50 border-red-500 text-red-900" : "bg-slate-50 border-slate-200 text-slate-400";
                      return (
                        <button key={idx} disabled={ans} onClick={() => { setPOpt(idx); if (idx === pQs[pIdx].correctIndex) setPScore((s) => s + 1); }} className={`w-full text-left p-4 rounded-xl border-2 text-sm font-medium flex items-center justify-between gap-3 ${st}`}>
                          <div className="flex items-center gap-3"><span className="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">{String.fromCharCode(65 + idx)}</span><span>{opt}</span></div>
                          {ans && ok && <Icons.Check c="w-5 h-5 text-emerald-600 shrink-0" />}{ans && sel && !ok && <Icons.X c="w-5 h-5 text-red-600 shrink-0" />}
                        </button>
                      );
                    })}
                  </div>
                  {pOpt !== null && (
                    <div className="p-4 rounded-xl bg-slate-900 text-white space-y-2">
                      <div className="text-xs font-bold uppercase text-amber-400">Szakmai magyarázat</div>
                      <p className="text-sm text-slate-200">{pQs[pIdx].explanation}</p>
                      <div className="pt-2 flex justify-end"><button onClick={nextPracticeQuestion} className="px-5 py-2 bg-red-600 text-white text-sm font-bold rounded-lg">{pIdx + 1 < pQs.length ? "Következő kérdés →" : "Eredmény"}</button></div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {subTab === "official" && (
            <div className="card p-6">
              {!oActive && !oRep ? (
                <div className="max-w-2xl mx-auto text-center space-y-5 py-4">
                  <div className="w-14 h-14 rounded-2xl bg-red-50 border border-red-200 text-red-600 flex items-center justify-center mx-auto"><Icons.Clip c="w-7 h-7" /></div>
                  <div><h3 className="text-xl font-bold">Hivatalos Éles Vizsga (OOC / IC / Alosztály)</h3><p className="text-sm text-slate-600 mt-1">Külön OOC (Szabályzat) és IC (Tananyag) éles vizsga • Minden egyes kérdésre <strong>30 másodperc</strong> áll rendelkezésre (ha lejár, a rendszer továbblép). Minimum ponthatár: <strong className="text-red-600">80%</strong>.</p></div>
                  <div className="text-left bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <select value={selCat} onChange={(e) => setSelCat(e.target.value)} className="inp font-semibold">{availCats.map((c) => <option key={c.id} value={c.id}>{c.label} ({Math.min(c.drawCount, (questionsByCat[c.id] || []).length)} kérdés)</option>)}</select>
                    <div className="grid grid-cols-3 gap-2 text-center">
                      <div className="bg-white p-2.5 rounded-lg border"><div className="text-xs text-slate-500">Kérdések</div><div className="font-bold">{Math.min(drawLimit, pool.length)} db</div></div>
                      <div className="bg-white p-2.5 rounded-lg border"><div className="text-xs text-slate-500">Idő / kérdés</div><div className="font-bold text-amber-600">30 mp</div></div>
                      <div className="bg-white p-2.5 rounded-lg border"><div className="text-xs text-slate-500">Ponthatár</div><div className="font-bold text-red-600">80%</div></div>
                    </div>
                  </div>
                  {!hasPerm ? (
                    <div className="p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm font-semibold flex items-center justify-center gap-2"><Icons.Lock c="w-5 h-5" /><span>{selCat === "altalanos_ooc" ? "Nincs engedélyezve az Általános OOC éles vizsgád! Kérj engedélyt a Vezetőségtől." : selCat === "altalanos_ic" ? "Nincs engedélyezve az Általános IC éles vizsgád! Kérj engedélyt a Vezetőségtől." : "Nincs engedélyezve az Alosztályi éles vizsgád! Kérj engedélyt az Alosztályvezetőtől vagy a Vezetőségtől."}</span></div>
                  ) : <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold">✓ Aktív vizsgaengedélyed van ehhez a vizsgához.</div>}
                  <button onClick={startOfficial} disabled={!pool.length || !hasPerm} className="px-6 py-3 bg-red-600 text-white font-bold rounded-xl disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed">Éles vizsga megkezdése</button>
                </div>
              ) : oActive ? (
                <div className="max-w-3xl mx-auto space-y-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 rounded-xl bg-slate-900 text-white">
                    <div>
                      <div className="text-xs text-slate-400 uppercase font-bold">{catMeta?.label}</div>
                      <div className="text-sm font-semibold">Kérdés {oIdx + 1} / {oQs.length} • Válaszolva: {Object.keys(oAns).length} / {oQs.length}</div>
                    </div>
                    <div className={`inline-flex items-center gap-2 px-4 py-2 rounded-lg font-mono text-lg font-extrabold ${oTimeLeft <= 8 ? "bg-red-600 animate-pulse" : "bg-slate-800 text-amber-400"}`}><Icons.Clock c="w-5 h-5" />{oTimeLeft} mp</div>
                  </div>
                  <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full transition-all duration-500 ${oTimeLeft <= 8 ? "bg-red-600" : "bg-amber-500"}`} style={{ width: `${(oTimeLeft / QUESTION_SEC_LIMIT) * 100}%` }} /></div>
                  <div className="p-5 rounded-xl border border-slate-200 bg-slate-50/50 space-y-4">
                    <h3 className="text-lg font-bold">{oIdx + 1}. {oQs[oIdx].question}</h3>
                    <div className="space-y-2.5">
                      {oQs[oIdx].options.map((opt, oi) => {
                        const chk = oAns[oIdx] === oi;
                        return <button key={oi} onClick={() => setOAns((p) => ({ ...p, [oIdx]: oi }))} className={`w-full text-left p-4 rounded-xl border-2 text-sm font-medium flex items-center gap-3 ${chk ? "bg-red-50 border-red-600 text-red-950 font-semibold" : "bg-white border-slate-200"}`}><span className={`w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 ${chk ? "bg-red-600 text-white" : "bg-slate-100"}`}>{String.fromCharCode(65 + oi)}</span><span>{opt}</span></button>;
                      })}
                    </div>
                  </div>
                  <div className="flex items-center justify-between pt-2">
                    <span className="text-xs text-slate-500">30 mp után a rendszer automatikusan a következő kérdésre lép.</span>
                    {oIdx < oQs.length - 1 ? (
                      <button onClick={advanceOfficialQuestion} className="px-6 py-2.5 bg-slate-900 hover:bg-red-600 text-white text-sm font-bold rounded-lg">Következő kérdés →</button>
                    ) : (
                      <button onClick={() => submitOfficial(oAns)} className="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg">Vizsga beadása</button>
                    )}
                  </div>
                </div>
              ) : (
                <div className="max-w-3xl mx-auto space-y-6">
                  <div className={`p-6 rounded-2xl border-2 text-center space-y-2 ${oRep.passed ? "bg-emerald-50 border-emerald-500 text-emerald-950" : "bg-red-50 border-red-500 text-red-950"}`}>
                    <div className="inline-flex px-4 py-1 rounded-full text-xs font-extrabold uppercase bg-white/80">{oRep.passed ? "SIKERES VIZSGA (MEGFELELT)" : "SIKERTELEN VIZSGA"}</div>
                    <div className="text-4xl font-extrabold pt-2">{oRep.percentage}%</div>
                    <p className="text-sm font-medium">Helyes: {oRep.score} / {oRep.total} • Időtartam: {oRep.durationSec} mp</p>
                  </div>
                  <div className="space-y-3">
                    {oRep.questions.map((q, idx) => {
                      const ua = oRep.answers[idx], ok = ua === q.correctIndex;
                      return (
                        <div key={q.id} className={`p-4 rounded-xl border text-sm ${ok ? "border-emerald-200 bg-emerald-50/40" : "border-red-200 bg-red-50/40"}`}>
                          <div className="font-bold mb-1">{idx + 1}. {q.question}</div>
                          <div className="text-xs">Te válaszod: <strong className={ok ? "text-emerald-700" : "text-red-700"}>{ua !== undefined ? q.options[ua] : "Lejárt az idő / Nem válaszolt"}</strong></div>
                          {!ok && <div className="text-xs">Helyes: <strong className="text-emerald-700">{q.options[q.correctIndex]}</strong></div>}
                          <div className="text-xs text-slate-600 italic mt-1">{q.explanation}</div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="flex justify-center"><button onClick={() => setORep(null)} className="px-6 py-2.5 bg-slate-900 text-white text-sm font-bold rounded-lg">Vissza</button></div>
                </div>
              )}
            </div>
          )}

          {subTab === "permissions" && (role === "alosztalyvezeto" || role === "vezetoseg") && (
            <div className="card p-6 space-y-4">
              <div><h3 className="text-lg font-bold">Éles Vizsgaengedélyek Kezelése (OOC / IC / Alosztály)</h3><p className="text-xs text-slate-500">Az <strong>OOC (Szabályzat)</strong> és <strong>IC (Tananyag)</strong> éles vizsgát csak a <strong>Vezetőség</strong>, az alosztályi vizsgát az <strong>Alosztályvezető</strong> és a <strong>Vezetőség</strong> is engedélyezheti.</p></div>
              <div className="overflow-x-auto rounded-xl border border-slate-200">
                <table className="w-full text-left border-collapse">
                  <thead><tr className="bg-slate-900 text-white text-xs uppercase"><th className="py-3 px-4">Jelvény</th><th className="py-3 px-4">IC-név</th><th className="py-3 px-4">Rang</th><th className="py-3 px-4 text-center">OOC éles vizsga</th><th className="py-3 px-4 text-center">IC éles vizsga</th><th className="py-3 px-4 text-center">Alosztályi vizsga</th></tr></thead>
                  <tbody className="divide-y divide-slate-200 text-sm">
                    {users.map((u) => {
                      const ri = ROLES[u.role] || ROLES.mentos;
                      return (
                        <tr key={u.id} className="hover:bg-slate-50">
                          <td className="py-3 px-4 font-mono text-xs font-bold text-slate-600">{u.badgeNumber}</td>
                          <td className="py-3 px-4 font-bold">{u.name}</td>
                          <td className="py-3 px-4"><span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${ri.badgeClass}`}>{ri.label}</span></td>
                          <td className="py-3 px-4 text-center">

                              : <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded text-xs font-bold ${u.canTakeOocExam ? "bg-emerald-100 text-emerald-800" : "bg-slate-100 text-slate-500"}`}><Icons.Lock c="w-3 h-3" />{u.canTakeOocExam ? "Engedélyezve" : "Csak Vezetőség"}</span>}
                          </td>
                          <td className="py-3 px-4 text-center">
                            {role === "vezetoseg" ? <button onClick={() => onUpdateUserField(u.id, { canTakeIcExam: !u.canTakeIcExam })} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${u.canTakeIcExam ? "bg-sky-600 text-white" : "bg-slate-200 text-slate-700"}`}>{u.canTakeIcExam ? "✓ Engedélyezve" : "Tiltva"}</button>
                              : <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded text-xs font-bold ${u.canTakeIcExam ? "bg-sky-100 text-sky-800" : "bg-slate-100 text-slate-500"}`}><Icons.Lock c="w-3 h-3" />{u.canTakeIcExam ? "Engedélyezve" : "Csak Vezetőség"}</span>}
